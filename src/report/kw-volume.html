<title>Объём поиска Google Play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Токены — из дизайна AppRadar (src/report/appradar.html): тот же продукт, тот же вид. */
  :root {
    --bg: #f3f4f8; --card: #ffffff; --text: #23262f; --muted: #6f768a; --faint: #a3a9b8;
    --border: #e7e9f1; --hover: #f7f8fc; --head: #fafbfe;
    --accent: #3d5afe; --accent-soft: #eaeeff; --accent-ink: #2b44d6;
    --green: #148a5b; --green-soft: #e4f7ee; --orange: #b86a06; --orange-soft: #fdf1e0;
    --red: #d23a3e; --red-soft: #fdeaea; --neutral: #9aa1b3;
    /* позиция фразы в подсказках: 1 — насыщенно, 5 — светло */
    --p1: #3d5afe; --p2: #6a81fe; --p3: #95a5fe; --p4: #bcc7ff; --p5: #dde3ff; --p0: #eef0f6;
    --grid: #eceef4;
    --shadow: 0 1px 2px rgba(25,28,40,.06), 0 8px 24px rgba(25,28,40,.05);
    --f-ui: Manrope, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --f-num: "JetBrains Mono", ui-monospace, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101220; --card: #191c2b; --text: #e8eaf2; --muted: #969db2; --faint: #636a80;
      --border: #262a3b; --hover: #1f2334; --head: #1c2030;
      --accent: #6d84ff; --accent-soft: #1e2547; --accent-ink: #9fb0ff;
      --green: #2ecc8f; --green-soft: #14322a; --orange: #f0a13a; --orange-soft: #33270f;
      --red: #f0666a; --red-soft: #351a1c; --neutral: #5c6378;
      --p1: #9fb0ff; --p2: #7a8ff2; --p3: #5b6fcf; --p4: #45539a; --p5: #353f6e; --p0: #22263a;
      --grid: #242839;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.28);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101220; --card: #191c2b; --text: #e8eaf2; --muted: #969db2; --faint: #636a80;
    --border: #262a3b; --hover: #1f2334; --head: #1c2030;
    --accent: #6d84ff; --accent-soft: #1e2547; --accent-ink: #9fb0ff;
    --green: #2ecc8f; --green-soft: #14322a; --orange: #f0a13a; --orange-soft: #33270f;
    --red: #f0666a; --red-soft: #351a1c; --neutral: #5c6378;
    --p1: #9fb0ff; --p2: #7a8ff2; --p3: #5b6fcf; --p4: #45539a; --p5: #353f6e; --p0: #22263a;
    --grid: #242839;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.28);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--f-ui); font-size: 14px; line-height: 1.45; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }

  .kw { min-height: 100vh; background: var(--bg); }
  .top { position: sticky; top: 0; z-index: 20; background: var(--card); border-bottom: 1px solid var(--border); }
  .top-in { max-width: 1440px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -.3px; }
  .brand-mark { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, #3d5afe, #7a5cf0); color: #fff; display: grid; place-items: center; font-size: 13px; }
  .brand-sub { color: var(--muted); font-weight: 600; }
  .top-right { margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  select, .input { padding: 8px 11px; border: 1px solid var(--border); border-radius: 9px; background: var(--card); font-size: 13px; font-weight: 600; }
  .input { font-weight: 500; min-width: 0; }
  .stamp { font-size: 12px; color: var(--muted); }

  .page { max-width: 1440px; margin: 0 auto; padding: 22px 24px 48px; display: flex; flex-direction: column; gap: 18px; }
  .eyebrow { color: var(--accent); font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; }
  h1 { margin: 0 0 6px; font-size: 26px; font-weight: 800; letter-spacing: -.5px; text-wrap: balance; }
  h2 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: -.2px; text-wrap: balance; }
  .lead { margin: 0; color: var(--muted); max-width: 72ch; text-wrap: pretty; }
  .head { display: flex; flex-direction: column; gap: 14px; }
  .nowrap { white-space: nowrap; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); }
  .panel { padding: 16px 18px; }
  .panel-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .panel-sub { color: var(--muted); font-size: 12.5px; }

  /* Стадии S0–S4 */
  .rail { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
  .step { padding: 9px 10px 10px; border-radius: 10px; background: var(--hover); border: 1px solid var(--border); min-width: 0; }
  .step-id { font-family: var(--f-num); font-size: 11px; font-weight: 700; color: var(--muted); }
  .step-title { font-size: 12.5px; font-weight: 700; margin-top: 2px; }
  .step-what { font-size: 11.5px; color: var(--muted); margin-top: 2px; text-wrap: pretty; }
  .step.done { background: var(--accent-soft); border-color: transparent; }
  .step.done .step-id { color: var(--accent-ink); }
  .step.now { background: var(--accent); border-color: var(--accent); color: #fff; }
  .step.now .step-id, .step.now .step-what { color: rgba(255,255,255,.82); }
  .next { margin-top: 8px; font-size: 12.5px; color: var(--muted); }
  .next b { color: var(--text); }

  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .kpi { padding: 14px 16px; }
  .kpi-label { font-size: 12px; font-weight: 700; color: var(--muted); }
  .kpi-value { font-family: var(--f-num); font-size: 24px; font-weight: 700; letter-spacing: -1px; margin-top: 6px; }
  .kpi-hint { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* Рабочая область: таблица + лестница выбранной фразы */
  .work { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 18px; align-items: start; }
  .toolbar { display: flex; gap: 8px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .pill { padding: 6px 11px; border-radius: 20px; border: 1px solid var(--border); background: var(--card); font-size: 12.5px; font-weight: 700; cursor: pointer; }
  .pill:hover { border-color: var(--accent); }
  .pill[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pill .c { font-family: var(--f-num); font-weight: 600; opacity: .75; margin-left: 4px; }
  .toolbar .input { margin-left: auto; width: 240px; }

  .tbl-wrap { overflow-x: auto; max-height: 720px; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; }
  thead th { position: sticky; top: 0; background: var(--head); z-index: 1; text-align: left; padding: 10px; font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; border-bottom: 1px solid var(--border); }
  th.sortable { cursor: pointer; }
  th.sortable:hover { color: var(--text); }
  th .th-sub { display: block; text-transform: none; letter-spacing: 0; font-weight: 600; color: var(--faint); font-size: 10.5px; }
  td { padding: 9px 10px; font-size: 13px; border-top: 1px solid var(--border); vertical-align: middle; }
  th:first-child, td:first-child { padding-left: 14px; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--hover); }
  tbody tr[aria-selected="true"] { background: var(--accent-soft); }
  .r { text-align: right; }
  .term { font-weight: 700; }
  .tags { display: inline-flex; gap: 4px; margin-left: 6px; vertical-align: 1px; }
  .tag { font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 5px; background: var(--hover); color: var(--muted); border: 1px solid var(--border); white-space: nowrap; }
  .tag.watch { background: var(--accent-soft); color: var(--accent-ink); border-color: transparent; }
  .tag.brand { background: var(--orange-soft); color: var(--orange); border-color: transparent; }

  .vol { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .vol-bar { width: 64px; height: 6px; border-radius: 3px; background: var(--p0); overflow: hidden; flex: 0 0 64px; }
  .vol-bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .vol-rel { font-family: var(--f-num); font-weight: 600; width: 34px; text-align: right; }
  .vol-unit { font-size: 11px; color: var(--muted); }
  .lock { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  .lock svg { flex: 0 0 auto; }

  .mini { display: inline-grid; grid-auto-flow: column; grid-auto-columns: 5px; gap: 1px; height: 14px; vertical-align: middle; }
  .mini i { display: block; border-radius: 1px; }

  /* Лестница префиксов */
  .detail { position: sticky; top: 72px; max-height: calc(100vh - 90px); overflow-y: auto; }
  .d-term { font-family: var(--f-num); font-size: 19px; font-weight: 700; letter-spacing: -.3px; word-break: break-word; }
  .d-sub { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .d-vol { margin: 14px 0 4px; padding: 12px 14px; border-radius: 11px; background: var(--hover); border: 1px solid var(--border); }
  .d-vol-main { font-size: 20px; font-weight: 800; letter-spacing: -.4px; }
  .d-vol-note { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .ladder { display: flex; flex-direction: column; margin-top: 14px; border: 1px solid var(--border); border-radius: 11px; overflow: hidden; }
  .rung { display: grid; grid-template-columns: 26px minmax(0, 1fr) 34px; gap: 8px; align-items: center; padding: 5px 10px; border-top: 1px solid var(--border); background: var(--card); width: 100%; text-align: left; border-left: 0; border-right: 0; border-bottom: 0; }
  .rung:first-child { border-top: 0; }
  button.rung { cursor: pointer; }
  button.rung:hover { background: var(--hover); }
  .rung-i { font-family: var(--f-num); font-size: 11px; color: var(--faint); text-align: right; }
  .rung-p { font-family: var(--f-num); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rung-p b { font-weight: 700; color: var(--text); }
  .rung-p span { color: var(--faint); }
  .pos { font-family: var(--f-num); font-size: 12px; font-weight: 700; width: 30px; height: 22px; border-radius: 6px; display: grid; place-items: center; justify-self: end; }
  .pos.k-i { background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.55) 0 2px, transparent 2px 5px); }
  .pos.k-a, .pos.k-n { background: transparent; color: var(--faint); border: 1px dashed var(--border); font-weight: 500; }
  .sugg { list-style: none; margin: 0; padding: 4px 10px 8px 44px; background: var(--hover); border-top: 1px solid var(--border); }
  .sugg li { font-size: 12.5px; padding: 2px 0; display: flex; gap: 8px; }
  .sugg li .n { font-family: var(--f-num); color: var(--faint); width: 12px; }
  .sugg li.hit { font-weight: 800; color: var(--accent-ink); }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; font-size: 11.5px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .sw { width: 14px; height: 10px; border-radius: 3px; display: inline-block; }

  .facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; margin-top: 14px; background: var(--border); border: 1px solid var(--border); border-radius: 11px; overflow: hidden; }
  .fact { background: var(--card); padding: 8px 10px; min-width: 0; }
  .fact-l { font-size: 11px; color: var(--muted); font-weight: 600; }
  .fact-v { font-family: var(--f-num); font-size: 13px; font-weight: 600; margin-top: 1px; overflow-wrap: anywhere; }

  .live { margin-top: 14px; padding: 12px; border-radius: 11px; border: 1px dashed var(--border); font-size: 12.5px; color: var(--muted); }
  .live code { font-family: var(--f-num); font-size: 12px; color: var(--text); background: var(--hover); padding: 1px 5px; border-radius: 5px; }
  .live-form { display: flex; gap: 8px; margin-top: 8px; }
  .live-form .input { flex: 1; }
  .btn { padding: 8px 12px; border-radius: 9px; border: 1px solid var(--accent); background: var(--accent); color: #fff; font-weight: 700; font-size: 13px; cursor: pointer; }
  .btn.ghost { background: var(--card); color: var(--accent-ink); border-color: var(--border); }
  .btn:disabled { opacity: .55; cursor: progress; }

  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart text { fill: var(--muted); font-family: var(--f-num); font-size: 11px; }
  .stat-line { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 10px; }
  .stat-line div { min-width: 0; }
  .stat-line .v { font-family: var(--f-num); font-size: 20px; font-weight: 700; letter-spacing: -.5px; }
  .stat-line .l { font-size: 12px; color: var(--muted); }
  .note { font-size: 12.5px; color: var(--muted); margin: 10px 0 0; max-width: 78ch; text-wrap: pretty; }
  .note b { color: var(--text); }

  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 20px; white-space: nowrap; }
  .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .s-ok { background: var(--green-soft); color: var(--green); }
  .s-warn { background: var(--orange-soft); color: var(--orange); }
  .s-bad { background: var(--red-soft); color: var(--red); }
  .s-off { background: var(--hover); color: var(--muted); border: 1px solid var(--border); }

  .checks { display: flex; flex-direction: column; }
  .check { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; padding: 10px 0; border-top: 1px solid var(--border); align-items: center; }
  .check:first-child { border-top: 0; padding-top: 0; }
  .check-t { font-weight: 700; font-size: 13.5px; }
  .check-d { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); text-wrap: pretty; }
  .check-d code, .acc code { font-family: var(--f-num); font-size: 11.5px; background: var(--hover); padding: 1px 5px; border-radius: 5px; color: var(--text); }

  .acc td { vertical-align: top; cursor: default; }
  .acc tbody tr { cursor: default; }
  .acc tbody tr:hover { background: transparent; }
  .acc .what { font-weight: 700; }
  .acc .stage { font-family: var(--f-num); font-size: 12px; font-weight: 700; color: var(--accent-ink); white-space: nowrap; }

  .lockpanel { display: flex; gap: 14px; align-items: flex-start; padding: 14px; border-radius: 11px; background: var(--hover); border: 1px solid var(--border); }
  .lockpanel svg { flex: 0 0 auto; margin-top: 2px; }

  .tip { position: fixed; z-index: 50; pointer-events: none; background: var(--card); color: var(--text); border: 1px solid var(--border); box-shadow: var(--shadow); border-radius: 9px; padding: 7px 10px; font-size: 12px; max-width: 280px; }
  .tip b { font-weight: 800; }
  .empty { padding: 28px; text-align: center; color: var(--muted); }

  @media (max-width: 1180px) {
    .work { grid-template-columns: minmax(0, 1fr); }
    .detail { position: static; max-height: none; }
  }
  @media (max-width: 820px) {
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid2 { grid-template-columns: minmax(0, 1fr); }
    .rail { grid-template-columns: repeat(5, minmax(96px, 1fr)); overflow-x: auto; }
    .toolbar .input { margin-left: 0; width: 100%; }
    .page, .top-in { padding-left: 16px; padding-right: 16px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="kw" id="kw-root">
  <header class="top">
    <div class="top-in">
      <div class="brand"><span class="brand-mark" aria-hidden="true">A</span>AppRadar <span class="brand-sub">· объём поиска</span></div>
      <div class="top-right">
        <label class="small muted" for="kw-geo">Страна</label>
        <select id="kw-geo"></select>
        <span class="stamp" id="kw-stamp"></span>
      </div>
    </div>
  </header>
  <main class="page" id="kw-page"></main>
  <div class="tip" id="kw-tip" hidden></div>
</div>

<script>
(function () {
  __UNPACK_JS__
  var DATA = unpackRows(__KW_DATA__);
  var LIVE = __KW_LIVE__;

  var STORE_KEY = 'kw-volume-state';
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {}; } catch (e) { saved = {}; }
  var state = {
    geo: DATA.geoData[saved.geo] ? saved.geo : (DATA.geos[0] && DATA.geos[0].geo),
    filter: 'all', q: '', sort: 'score', dir: -1, term: null, open: {}, lenField: 'score_raw',
  };
  function persist() { try { localStorage.setItem(STORE_KEY, JSON.stringify({ geo: state.geo })); } catch (e) {} }

  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function int(v) { return v == null ? '—' : Math.round(v).toLocaleString('ru-RU'); }
  function dec(v, d) { return v == null ? '—' : Number(v).toLocaleString('ru-RU', { minimumFractionDigits: d, maximumFractionDigits: d }); }
  function pct(v) { return v == null ? '—' : Math.round(v * 100) + ' %'; }
  function short(v) {
    if (v == null) return '—';
    var a = Math.abs(v);
    if (a >= 1e9) return dec(v / 1e9, a >= 1e10 ? 0 : 1) + ' млрд';
    if (a >= 1e6) return dec(v / 1e6, a >= 1e7 ? 0 : 1) + ' млн';
    if (a >= 1e3) return dec(v / 1e3, a >= 1e4 ? 0 : 1) + ' тыс.';
    return a >= 10 ? int(v) : dec(v, 1);
  }
  function date(s) {
    if (!s) return '—';
    var p = String(s).slice(0, 10).split('-');
    return p[2] + '.' + p[1] + '.' + p[0];
  }
  var LOCK = '<svg width="13" height="14" viewBox="0 0 13 14" aria-hidden="true"><rect x="1.5" y="6" width="10" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M4 6V4.2a2.5 2.5 0 0 1 5 0V6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>';
  var BIGLOCK = '<svg width="26" height="28" viewBox="0 0 13 14" aria-hidden="true"><rect x="1.5" y="6" width="10" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M4 6V4.2a2.5 2.5 0 0 1 5 0V6" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>';

  var SOURCE = { seed: 'семя', suggest: 'подсказка', template: 'шаблон', ngram: 'n-грамма', watch: 'избранное', console: 'Console', manual: 'вручную' };
  var METHOD = { exact: 'все префиксы', binary: 'бинарный поиск', rough: 'три префикса', cache: 'из кэша' };
  var LEVEL = { none: 'нет', ordinal: 'порядковый', bucket: 'бакет', interval: 'интервал' };

  function G() { return DATA.geoData[state.geo]; }
  function geoName(code) { var g = DATA.geos.find(function (x) { return x.geo === code; }); return g ? g.name : code; }
  function posVar(p) { return p >= 1 && p <= 5 ? 'var(--p' + p + ')' : 'var(--p5)'; }

  // ---------- подсказка ----------
  var tip = $('kw-tip');
  function showTip(html, ev) {
    tip.innerHTML = html; tip.hidden = false;
    var x = ev.clientX + 14, y = ev.clientY + 14;
    var w = tip.offsetWidth, h = tip.offsetHeight;
    if (x + w > window.innerWidth - 8) x = ev.clientX - w - 14;
    if (y + h > window.innerHeight - 8) y = ev.clientY - h - 14;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  }
  function hideTip() { tip.hidden = true; }

  // ---------- колонка «Показы/день» ----------
  function volumeCell(k) {
    var lvl = k.confidence_level;
    if (!lvl || lvl === 'none' || k.popularity_score == null) {
      return '<span class="lock">' + LOCK + 'нет score</span>';
    }
    if (lvl === 'ordinal') {
      return '<span class="vol" title="Относительная шкала 0–100 внутри гео и категории. Это не показы."><span class="vol-bar"><i style="width:' + Math.max(2, k.popularity_score) + '%"></i></span>' +
        '<span class="vol-rel">' + Math.round(k.popularity_score) + '</span><span class="vol-unit">отн.</span></span>';
    }
    if (lvl === 'bucket') {
      return '<span class="vol" title="' + esc('Модель ' + k.model_version + ', калибровка ' + date(k.calibrated_at)) + '"><b>' + esc(k.bucket) + '</b></span>';
    }
    return '<span class="vol" title="' + esc('p50 (p10–p90), модель ' + k.model_version + ', калибровка ' + date(k.calibrated_at)) + '"><b class="num">' + short(k.impressions_est) + '</b>' +
      '<span class="vol-unit num">' + short(k.impressions_lo) + '–' + short(k.impressions_hi) + '</span></span>';
  }

  function miniLadder(k) {
    var probes = k.probes ? JSON.parse(k.probes) : [];
    return '<span class="mini" aria-hidden="true">' + probes.map(function (p) {
      var bg = p[1] ? posVar(p[1]) : 'var(--p0)';
      var op = p[2] === 'i' ? ';opacity:.55' : '';
      return '<i style="background:' + bg + op + '"></i>';
    }).join('') + '</span>';
  }

  // ---------- шапка, стадии, сводка ----------
  function renderHead(g) {
    var m = g.maturity;
    var idx = DATA.stages.findIndex(function (s) { return s.id === m.stage; });
    var rail = DATA.stages.map(function (s, i) {
      var cls = i < idx ? 'done' : i === idx ? 'now' : '';
      return '<div class="step ' + cls + '"' + (i === idx ? ' aria-current="step"' : '') + '><div class="step-id">' + s.id + '</div><div class="step-title">' + esc(s.title) + '</div><div class="step-what">' + esc(s.what) + '</div></div>';
    }).join('');
    var lead = m.stage === 'S0' || m.stage === 'S1'
      ? 'У Google Play нет публичной популярности запроса. Пока нет выгрузки Play Console, колонка «Показы/день» показывает только порядок слов — относительную шкалу 0–100 из подсказок Play, а не показы.'
      : 'Модель откалибрована по выгрузке Play Console: рядом с каждым числом — модель и дата калибровки. Числа — оценка, а не измерение.';
    return '<section class="head">' +
      '<div><div class="eyebrow">' + esc(geoName(g.geo)) + ' · ' + esc(g.hl) + '</div><h1>Объём поиска по ключам</h1><p class="lead">' + lead + '</p></div>' +
      '<div class="card panel"><div class="rail">' + rail + '</div><div class="next">Дальше: <b>' + esc(m.next) + '</b></div></div>' +
      '</section>';
  }

  function renderKpis(g) {
    var ks = g.keywords, dg = g.diagnostics, run = g.health.runs[0];
    var surfaced = dg.n_positive, total = ks.length + g.pending.length;
    var levels = {};
    ks.forEach(function (k) { levels[k.confidence_level || 'none'] = (levels[k.confidence_level || 'none'] || 0) + 1; });
    var levelText = Object.keys(levels).map(function (l) { return (LEVEL[l] || l) + ' ' + levels[l]; }).join(' · ');
    var model = g.maturity.active_model;
    return '<section class="kpis">' +
      kpi('Слов со score', int(ks.length), 'из ' + int(total) + ' в словаре гео') +
      kpi('Всплывают в подсказках', int(surfaced), ks.length ? Math.round(surfaced / ks.length * 100) + ' % — остальные не видны ни на одном префиксе' : 'нет расчёта') +
      kpi('Запросов к подсказкам', run ? int(run.requests) : '—', run ? int(run.cache_hits) + ' префиксов взято из кэша · ' + date(run.day) : 'расчёта ещё не было') +
      kpi('Уровень доверия', model ? (model.kind === 'gbm' ? 'интервал' : 'бакет') : 'порядковый', model ? 'ρ ' + dec(model.spearman, 2) + ' · ' + esc(model.model_version) : levelText || '—') +
      '</section>';
  }
  function kpi(l, v, h) { return '<div class="card kpi"><div class="kpi-label">' + l + '</div><div class="kpi-value">' + v + '</div><div class="kpi-hint">' + h + '</div></div>'; }

  // ---------- таблица ----------
  var FILTERS = [
    { id: 'all', t: 'Все', f: function () { return true; } },
    { id: 'tracked', t: 'Отслеживаемые', f: function (k) { return k.tracked; } },
    { id: 'surfaced', t: 'Всплывают', f: function (k) { return k.score_raw > 0; } },
    { id: 'zero', t: 'Не всплывают', f: function (k) { return k.score_raw === 0; } },
    { id: 'pending', t: 'Без score', f: null },
  ];
  var SORTS = {
    term: function (k) { return k.term; },
    score: function (k) { return k.popularity_score; },
    min: function (k) { return k.min_prefix_len == null ? null : -k.min_prefix_len; },
    pos: function (k) { return k.avg_suggest_pos == null ? null : -k.avg_suggest_pos; },
    inst: function (k) { return k.top10_installs_median; },
    title: function (k) { return k.title_match_share; },
  };

  function rowsFor(g) {
    var q = state.q.trim().toLowerCase();
    if (state.filter === 'pending') {
      return g.pending.filter(function (t) { return !q || t.indexOf(q) >= 0; }).map(function (t) { return { term: t, pending: true }; });
    }
    var flt = FILTERS.find(function (f) { return f.id === state.filter; }).f;
    var key = SORTS[state.sort];
    return g.keywords.filter(function (k) { return flt(k) && (!q || k.term.indexOf(q) >= 0); })
      .slice().sort(function (a, b) {
        var x = key(a), y = key(b);
        if (x == null && y == null) return 0;
        if (x == null) return 1;
        if (y == null) return -1;
        return (x < y ? -1 : x > y ? 1 : 0) * state.dir;
      });
  }

  function renderTable(g) {
    var rows = rowsFor(g);
    var counts = {};
    FILTERS.forEach(function (f) { counts[f.id] = f.f ? g.keywords.filter(f.f).length : g.pending.length; });
    var ordinal = !g.maturity.active_model;
    var th = function (key, label, sub, r) {
      var arrow = state.sort === key ? (state.dir < 0 ? ' ↓' : ' ↑') : '';
      return '<th class="sortable' + (r ? ' r' : '') + '" data-sort="' + key + '" aria-sort="' + (state.sort === key ? (state.dir < 0 ? 'descending' : 'ascending') : 'none') + '">' + label + arrow + (sub ? '<span class="th-sub">' + sub + '</span>' : '') + '</th>';
    };
    var body = rows.length ? rows.map(function (k) {
      if (k.pending) {
        return '<tr data-term="' + esc(k.term) + '"><td><span class="term">' + esc(k.term) + '</span></td><td colspan="5"><span class="lock">' + LOCK + 'score не считался — будет в следующем расчёте</span></td></tr>';
      }
      var tags = '';
      if (k.tracked) tags += '<span class="tag watch">отслеживается</span>';
      if (k.is_brand) tags += '<span class="tag brand">бренд</span>';
      return '<tr data-term="' + esc(k.term) + '" aria-selected="' + (k.term === state.term) + '">' +
        '<td><span class="term">' + esc(k.term) + '</span><span class="tags">' + tags + '</span></td>' +
        '<td>' + volumeCell(k) + '</td>' +
        '<td class="nowrap">' + miniLadder(k) + ' <span class="num small">' + (k.min_prefix_len ? k.min_prefix_len + '-я' : '—') + '</span></td>' +
        '<td class="r num">' + (k.avg_suggest_pos == null ? '—' : dec(k.avg_suggest_pos, 1)) + '</td>' +
        '<td class="r num">' + short(k.top10_installs_median) + '</td>' +
        '<td class="r num">' + pct(k.title_match_share) + '</td>' +
        '</tr>';
    }).join('') : '<tr><td colspan="6" class="empty">Ничего не найдено</td></tr>';

    return '<div class="card">' +
      '<div class="toolbar" role="toolbar" aria-label="Фильтр слов">' +
      FILTERS.map(function (f) { return '<button class="pill" data-filter="' + f.id + '" aria-pressed="' + (state.filter === f.id) + '">' + f.t + '<span class="c">' + counts[f.id] + '</span></button>'; }).join('') +
      '<input class="input" id="kw-q" type="search" placeholder="Найти фразу" aria-label="Найти фразу" value="' + esc(state.q) + '">' +
      '</div>' +
      '<div class="tbl-wrap"><table><thead><tr>' +
      th('term', 'Фраза', '') +
      th('score', 'Показы/день', ordinal ? 'относительная шкала, не показы' : 'по модели гео') +
      th('min', 'Всплывает с буквы', 'лестница префиксов') +
      th('pos', 'Ср. позиция', 'в подсказках', true) +
      th('inst', 'Установки топ-10', 'медиана', true) +
      th('title', 'В заголовках', 'топ-10', true) +
      '</tr></thead><tbody id="kw-body">' + body + '</tbody></table></div></div>';
  }

  // ---------- лестница выбранной фразы ----------
  function renderDetail(g) {
    var k = g.keywords.find(function (x) { return x.term === state.term; });
    if (!k) return '<aside class="card panel detail"><div class="empty">Выберите фразу в таблице</div></aside>';
    var chars = Array.from(k.term);
    var probes = k.probes ? JSON.parse(k.probes) : [];
    var firstHit = probes.find(function (p) { return p[2] === 's' && p[1]; });
    var openKey = state.open[k.term] != null ? state.open[k.term] : (firstHit ? firstHit[0] : null);

    var rungs = probes.map(function (p) {
      var i = p[0], pos = p[1], kind = p[2];
      var prefix = chars.slice(0, i).join('');
      var rest = chars.slice(i).join('');
      var label = kind === 's' ? 'позиция ' + pos + ' в подсказках' : kind === 'i' ? 'позиция выведена по соседним снятым префиксам' : kind === 'a' ? 'снято: фразы нет в подсказках' : 'не снималось: ниже точки появления';
      var chip = pos
        ? '<span class="pos k-' + kind + '" style="background-color:' + posVar(pos) + ';color:' + (pos <= 2 ? '#fff' : 'var(--text)') + '">' + pos + '</span>'
        : '<span class="pos k-' + kind + '">' + (kind === 'a' ? '×' : '·') + '</span>';
      var list = g.suggest[prefix];
      var clickable = (kind === 's' || kind === 'a') && list;
      var inner = '<span class="rung-i">' + i + '</span><span class="rung-p"><b>' + esc(prefix.replace(/ /g, '␣')) + '</b><span>' + esc(rest) + '</span></span>' + chip;
      var html = clickable
        ? '<button class="rung" data-rung="' + i + '" aria-expanded="' + (openKey === i) + '" title="' + esc(label) + '">' + inner + '</button>'
        : '<div class="rung" title="' + esc(label) + '">' + inner + '</div>';
      if (clickable && openKey === i) {
        html += '<ol class="sugg">' + (list.length ? list.map(function (s, n) {
          return '<li class="' + (s.toLowerCase() === k.term ? 'hit' : '') + '"><span class="n">' + (n + 1) + '</span>' + esc(s) + '</li>';
        }).join('') : '<li>Play не предложил ни одного продолжения</li>') + '</ol>';
      }
      return html;
    }).join('');

    var vol;
    if (k.confidence_level === 'interval') {
      vol = '<div class="d-vol-main num">' + short(k.impressions_est) + ' в день</div><div class="d-vol-note">интервал p10–p90: ' + short(k.impressions_lo) + '–' + short(k.impressions_hi) + ' · ' + esc(k.bucket || '') + '<br>модель ' + esc(k.model_version) + ', калибровка ' + date(k.calibrated_at) + '</div>';
    } else if (k.confidence_level === 'bucket') {
      vol = '<div class="d-vol-main">' + esc(k.bucket) + '</div><div class="d-vol-note">бакет по модели ' + esc(k.model_version) + ', калибровка ' + date(k.calibrated_at) + '</div>';
    } else {
      vol = '<div class="d-vol-main num">' + (k.popularity_score == null ? '—' : Math.round(k.popularity_score)) + ' <span class="muted small">из 100, отн.</span></div>' +
        '<div class="d-vol-note">Порядковая шкала: выше, чем у ' + (k.popularity_score == null ? '—' : Math.round(k.popularity_score) + ' %') + ' слов ' + (k.score_group && k.score_group !== '*' ? 'категории ' + esc(k.score_group) : 'гео') + '. Это не показы — для чисел нужна калибровка по Play Console.</div>';
    }

    var facts = [
      ['Сырой score (формула 4.2)', dec(k.score_raw, 2)],
      ['Доля от максимума для длины', dec(k.score_raw_norm, 2)],
      ['Префиксов с фразой', k.prefixes_total ? Math.round(k.prefix_hit_share * k.prefixes_total) + ' из ' + k.prefixes_total : '—'],
      ['Способ расчёта', (METHOD[k.method] || k.method) + (k.requests != null ? ', ' + k.requests + ' запр.' : '')],
      ['Установки топ-10, медиана', short(k.top10_installs_median)],
      ['Отзывы топ-10, медиана', short(k.top10_reviews_median)],
      ['Точное вхождение в заголовки', pct(k.title_match_share)],
      ['Разброс установок 1–10', k.installs_spread == null ? '—' : dec(k.installs_spread, 1) + ' порядка'],
      ['Гео с фразой в подсказках', int(k.suggest_geo_count)],
      ['Слов / символов', int(k.words) + ' / ' + int(k.chars)],
      ['Категория выдачи', k.category ? esc(k.category) : '—'],
      ['Keyword Planner', k.kp_volume == null ? 'нет выгрузки' : '~' + short(Math.pow(10, k.kp_volume)) + ' в мес'],
      ['Apple Search Ads', k.asa_popularity == null ? 'нет данных' : int(k.asa_popularity)],
      ['Расчёт / срез выдачи', date(k.signals_day) + ' / ' + date(k.serp_date)],
    ].map(function (f) { return '<div class="fact"><div class="fact-l">' + f[0] + '</div><div class="fact-v">' + f[1] + '</div></div>'; }).join('');

    var tags = '';
    if (k.source) tags += '<span class="tag">' + esc(SOURCE[k.source] || k.source) + '</span>';
    if (k.tracked) tags += '<span class="tag watch">отслеживается</span>';
    if (k.is_brand) tags += '<span class="tag brand">бренд</span>';
    if (k.is_translit) tags += '<span class="tag">транслит</span>';

    var live = LIVE
      ? '<div class="live"><b>Проверить другую фразу</b> — снимем префиксы в ' + esc(g.geo) + ' прямо сейчас (4–6 запросов к Play).' +
        '<div class="live-form"><input class="input" id="kw-estimate" placeholder="например, pdf scanner" aria-label="Фраза для оценки"><button class="btn" id="kw-estimate-go">Оценить</button></div>' +
        '<div class="live-form"><button class="btn ghost" id="kw-watch-go">' + (k.tracked ? 'Уже отслеживается' : 'Отслеживать «' + esc(k.term) + '»') + '</button></div><div id="kw-live-msg" class="small" role="status"></div></div>'
      : '<div class="live">Проверить новую фразу — в локальном сервисе: <code>npm run kw serve</code> или <code>node src/kw.js estimate --geo ' + esc(g.geo) + ' "фраза"</code></div>';

    return '<aside class="card panel detail" aria-label="Лестница префиксов">' +
      '<div class="d-term">' + esc(k.term) + '</div><div class="d-sub">' + tags + '</div>' +
      '<div class="d-vol">' + vol + '</div>' +
      '<div class="panel-head" style="margin:14px 0 0"><h2>Лестница префиксов</h2><span class="panel-sub">фраза набирается по буквам; позиция — место в подсказках Play</span></div>' +
      '<div class="ladder">' + (rungs || '<div class="empty">Префиксы не сняты</div>') + '</div>' +
      '<div class="legend"><span><i class="sw" style="background:var(--p1)"></i>1-я</span><span><i class="sw" style="background:var(--p3)"></i>3-я</span><span><i class="sw" style="background:var(--p5)"></i>5-я</span>' +
      '<span><i class="sw" style="background:var(--p2);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.55) 0 2px,transparent 2px 5px)"></i>выведено</span><span><i class="sw" style="border:1px dashed var(--border)"></i>нет</span></div>' +
      '<div class="facts">' + facts + '</div>' + live + '</aside>';
  }

  // ---------- графики ----------
  function axisTicks(max, n) {
    if (max <= 0) return [0];
    var raw = max / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
    var step = [1, 2, 2.5, 5, 10].map(function (m) { return m * mag; }).find(function (s) { return s >= raw; });
    var out = [];
    for (var v = 0; v <= max + step * 0.001; v += step) out.push(Math.round(v * 1e6) / 1e6);
    if (out[out.length - 1] < max) out.push(out[out.length - 1] + step);
    return out;
  }

  function prefixChart(g) {
    var dg = g.diagnostics;
    if (!dg.min_prefix.length) return '<div class="empty">Нет всплывших фраз</div>';
    var minL = DATA.config.score.min_prefix, maxL = Math.max.apply(null, dg.min_prefix.map(function (d) { return d.len; }).concat([minL + 6]));
    var bins = [];
    for (var L = minL; L <= maxL; L++) {
      var hit = dg.min_prefix.find(function (d) { return d.len === L; });
      bins.push({ len: L, n: hit ? hit.n : 0 });
    }
    var W = 560, H = 220, ml = 36, mr = 8, mt = 12, mb = 34;
    var ticks = axisTicks(Math.max.apply(null, bins.map(function (b) { return b.n; })), 4);
    var ymax = ticks[ticks.length - 1];
    var band = (W - ml - mr) / bins.length, bw = Math.min(24, band * 0.62);
    var y = function (v) { return mt + (H - mt - mb) * (1 - v / ymax); };
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Число фраз по букве, с которой фраза впервые появляется в подсказках">';
    ticks.forEach(function (t) { s += '<line x1="' + ml + '" x2="' + (W - mr) + '" y1="' + y(t) + '" y2="' + y(t) + '" stroke="var(--grid)" stroke-width="1"/><text x="' + (ml - 6) + '" y="' + (y(t) + 4) + '" text-anchor="end">' + t + '</text>'; });
    bins.forEach(function (b, i) {
      var cx = ml + band * i + band / 2, x0 = cx - bw / 2, y0 = y(b.n), yb = y(0), r = Math.min(4, (yb - y0) / 2);
      if (b.n > 0) {
        s += '<path d="M' + x0 + ' ' + yb + 'V' + (y0 + r) + 'Q' + x0 + ' ' + y0 + ' ' + (x0 + r) + ' ' + y0 + 'H' + (x0 + bw - r) + 'Q' + (x0 + bw) + ' ' + y0 + ' ' + (x0 + bw) + ' ' + (y0 + r) + 'V' + yb + 'Z" fill="var(--accent)"/>';
      }
      s += '<rect class="hit" x="' + (ml + band * i) + '" y="' + mt + '" width="' + band + '" height="' + (H - mt - mb) + '" fill="transparent" data-tip="' + esc('<b>' + b.len + '-я буква</b><br>' + b.n + ' фраз впервые видны в подсказках на этом префиксе') + '"/>';
      s += '<text x="' + cx + '" y="' + (H - mb + 16) + '" text-anchor="middle">' + b.len + '</text>';
    });
    s += '<text x="' + ((W + ml) / 2) + '" y="' + (H - 2) + '" text-anchor="middle">буква, на которой фраза впервые в подсказках</text>';
    return s + '</svg>';
  }

  function lengthChart(g) {
    var pts = g.diagnostics.length_points, f = state.lenField === 'score_raw' ? 'raw' : 'norm';
    if (pts.length < 5) return '<div class="empty">Мало всплывших фраз</div>';
    var W = 560, H = 220, ml = 40, mr = 10, mt = 12, mb = 34;
    var xs = pts.map(function (p) { return p.chars; }), ys = pts.map(function (p) { return p[f]; });
    var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
    if (x1 === x0) x1 = x0 + 1;
    var ticks = axisTicks(Math.max.apply(null, ys), 4), ymax = ticks[ticks.length - 1];
    var X = function (v) { return ml + (W - ml - mr) * (v - x0) / (x1 - x0); };
    var Y = function (v) { return mt + (H - mt - mb) * (1 - v / ymax); };
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Score фразы против её длины">';
    ticks.forEach(function (t) { s += '<line x1="' + ml + '" x2="' + (W - mr) + '" y1="' + Y(t) + '" y2="' + Y(t) + '" stroke="var(--grid)" stroke-width="1"/><text x="' + (ml - 6) + '" y="' + (Y(t) + 4) + '" text-anchor="end">' + (ymax <= 2 ? dec(t, 1) : t) + '</text>'; });
    var step = Math.max(1, Math.round((x1 - x0) / 6));
    for (var v = x0; v <= x1; v += step) s += '<text x="' + X(v) + '" y="' + (H - mb + 16) + '" text-anchor="middle">' + v + '</text>';
    pts.forEach(function (p) {
      s += '<circle cx="' + X(p.chars) + '" cy="' + Y(p[f]) + '" r="4" fill="var(--accent)" fill-opacity=".62" stroke="var(--card)" stroke-width="1.5" data-tip="' + esc('<b>' + p.term + '</b><br>' + p.chars + ' символов · score ' + dec(p[f], 2)) + '"/>';
    });
    s += '<text x="' + ((W + ml) / 2) + '" y="' + (H - 2) + '" text-anchor="middle">длина фразы, символов</text>';
    return s + '</svg>';
  }

  function ctrChart(g) {
    var prior = { ctr1: DATA.config.ctr.prior_ctr1, alpha: DATA.config.ctr.prior_alpha };
    var fit = g.ctr.find(function (c) { return c.source === 'fit'; });
    var series = [{ name: 'Приор методики', c: prior, color: 'var(--neutral)', dash: '5 4' }];
    if (fit) series.push({ name: 'Подогнано ' + date(fit.fitted_at), c: fit, color: 'var(--accent)', dash: '' });
    var W = 560, H = 210, ml = 40, mr = 16, mt = 12, mb = 34, P = 20;
    var ymax = axisTicks(Math.max.apply(null, series.map(function (s) { return s.c.ctr1; })), 4);
    var top = ymax[ymax.length - 1];
    var X = function (p) { return ml + (W - ml - mr) * (p - 1) / (P - 1); };
    var Y = function (v) { return mt + (H - mt - mb) * (1 - v / top); };
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Кривая CTR по позиции в выдаче">';
    ymax.forEach(function (t) { s += '<line x1="' + ml + '" x2="' + (W - mr) + '" y1="' + Y(t) + '" y2="' + Y(t) + '" stroke="var(--grid)" stroke-width="1"/><text x="' + (ml - 6) + '" y="' + (Y(t) + 4) + '" text-anchor="end">' + Math.round(t * 100) + '%</text>'; });
    [1, 5, 10, 15, 20].forEach(function (p) { s += '<text x="' + X(p) + '" y="' + (H - mb + 16) + '" text-anchor="middle">' + p + '</text>'; });
    series.forEach(function (se) {
      var d = '';
      for (var p = 1; p <= P; p++) d += (p === 1 ? 'M' : 'L') + X(p).toFixed(1) + ' ' + Y(se.c.ctr1 / Math.pow(p, se.c.alpha)).toFixed(1);
      s += '<path d="' + d + '" fill="none" stroke="' + se.color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"' + (se.dash ? ' stroke-dasharray="' + se.dash + '"' : '') + '/>';
      s += '<circle cx="' + X(1) + '" cy="' + Y(se.c.ctr1) + '" r="4" fill="' + se.color + '" stroke="var(--card)" stroke-width="2"/>';
    });
    for (var p = 1; p <= P; p++) {
      var lines = series.map(function (se) { return se.name + ': ' + dec(se.c.ctr1 / Math.pow(p, se.c.alpha) * 100, 1) + ' %'; }).join('<br>');
      s += '<rect x="' + (X(p) - (W - ml - mr) / (P - 1) / 2) + '" y="' + mt + '" width="' + ((W - ml - mr) / (P - 1)) + '" height="' + (H - mt - mb) + '" fill="transparent" data-tip="' + esc('<b>Позиция ' + p + '</b><br>' + lines) + '"/>';
    }
    s += '<text x="' + ((W + ml) / 2) + '" y="' + (H - 2) + '" text-anchor="middle">позиция приложения в выдаче</text>';
    var legend = '<div class="legend">' + series.map(function (se) {
      return '<span><svg width="22" height="8" aria-hidden="true"><line x1="1" y1="4" x2="21" y2="4" stroke="' + se.color + '" stroke-width="2"' + (se.dash ? ' stroke-dasharray="' + se.dash + '"' : '') + '/></svg>' + esc(se.name) + ' — ' + dec(se.c.ctr1, 2) + ' / p^' + dec(se.c.alpha, 2) + '</span>';
    }).join('') + '</div>';
    return legend + s + '</svg>';
  }

  // ---------- разделы под таблицей ----------
  function renderSignal(g) {
    var dg = g.diagnostics;
    var rhoSpec = dg.rho_len_spec, rhoNorm = dg.rho_len_norm;
    return '<section class="grid2">' +
      '<div class="card panel chart"><div class="panel-head"><h2>С какой буквы фразы всплывают</h2><span class="panel-sub">' + int(dg.n_positive) + ' всплывших фраз · ещё ' + int(dg.zero) + ' не видны ни на одном префиксе</span></div>' +
      prefixChart(g) +
      '<p class="note">Чем раньше фраза появляется в подсказках при наборе, тем она популярнее (раздел 4.1). Фраза, которая не всплывает даже целиком, получает <b>score 0</b>: это отсутствие сигнала, а не отсутствие спроса — Play фильтрует часть подсказок.</p></div>' +
      '<div class="card panel chart"><div class="panel-head"><h2>Длина фразы и score</h2>' +
      '<span class="toolbar" style="padding:0;border:0;margin-left:auto">' +
      '<button class="pill" data-len="score_raw" aria-pressed="' + (state.lenField === 'score_raw') + '">Формула ТЗ</button>' +
      '<button class="pill" data-len="score_raw_norm" aria-pressed="' + (state.lenField === 'score_raw_norm') + '">Доля от максимума</button></span></div>' +
      '<div class="stat-line"><div><div class="v">' + (rhoSpec == null ? '—' : dec(rhoSpec, 2)) + '</div><div class="l">ρ с длиной, формула 4.2</div></div>' +
      '<div><div class="v">' + (rhoNorm == null ? '—' : dec(rhoNorm, 2)) + '</div><div class="l">ρ с длиной, доля от максимума</div></div>' +
      '<div><div class="v">' + (dg.rho_inst_spec == null ? '—' : dec(dg.rho_inst_spec, 2)) + '</div><div class="l">ρ с установками топ-10 (не валидация)</div></div></div>' +
      lengthChart(g) +
      '<p class="note">Нормировка w<sub>len</sub> = (L − i + 1)/L не снимает рост суммы с длиной: у длинной фразы больше слагаемых. На синтетике это давало ρ 0,67 с длиной при истинной −0,12. Какой вариант брать, решает <b>валидация на Play Console</b>, а не график — поэтому в расчёте хранятся оба.</p></div>' +
      '</section>';
  }

  function renderCalibration(g) {
    var m = g.maturity, cfg = DATA.config;
    var models = g.models.length ? '<div class="tbl-wrap" style="max-height:none"><table class="acc"><thead><tr><th>Модель</th><th>Окно</th><th class="r">Слов / прил.</th><th class="r">Spearman</th><th class="r">Бакет</th><th class="r">Сумма</th><th>Статус</th></tr></thead><tbody>' +
      g.models.map(function (md) {
        var st = md.active ? '<span class="status s-ok">действует</span>' : md.spearman != null && md.spearman < cfg.validation.spearman_bucket ? '<span class="status s-bad">ниже порога</span>' : '<span class="status s-off">заменена</span>';
        return '<tr><td><span class="what num">' + esc(md.model_version) + '</span><div class="small muted">' + esc(md.stage) + ' · ' + esc(md.metric_kind || '') + ' · ' + esc((md.validation && md.validation.scheme) || '') + '</div></td>' +
          '<td class="num small">' + date(md.window_from) + '–' + date(md.window_to) + '</td><td class="r num">' + int(md.n_terms) + ' / ' + int(md.n_apps) + '</td>' +
          '<td class="r num">' + dec(md.spearman, 2) + '</td><td class="r num">' + pct(md.bucket_hit) + '</td><td class="r num">×' + dec(md.sum_ratio, 2) + '</td><td>' + st + '</td></tr>';
      }).join('') + '</tbody></table></div>'
      : '<div class="lockpanel">' + BIGLOCK + '<div><b>Калибровки ещё не было.</b> Без выгрузки Play Console модель нечем обучать — поэтому в колонке нет показов (правило 1 методики).' +
        '<div class="small muted" style="margin-top:6px">Чтобы открыть бакеты (S2): выгрузка Console → Search terms по одному приложению за ' + cfg.calibration.window_days + ' дней, затем <code>node src/kw.js import-console --file terms.csv</code> и <code>node src/kw.js run</code>. Порог включения — Spearman ≥ ' + dec(cfg.validation.spearman_bucket, 1) + ' на отложенных ' + cfg.calibration.holdout_days + ' днях; интервалы (S3) — ≥ ' + dec(cfg.validation.spearman_interval, 1) + ' на ' + cfg.calibration.min_apps_gbm + '+ приложениях.</div></div></div>';
    var consoleRows = g.consoleApps.length ? '<div class="checks" style="margin-top:14px">' + g.consoleApps.map(function (a) {
      return '<div class="check"><span class="check-t num">' + esc(a.app_id) + '</span><span class="status s-ok">' + esc(a.metric_kind) + '</span><div class="check-d">' + int(a.rows) + ' строк, из них цензурировано ' + int(a.censored) + ' · ' + int(a.terms) + ' слов · ' + date(a.first) + '–' + date(a.last) + ' · CVR ' + pct(a.cvr) + '</div></div>';
    }).join('') + '</div>' : '';
    return '<section class="grid2">' +
      '<div class="card panel"><div class="panel-head"><h2>Калибровка по Play Console</h2><span class="panel-sub">' + (m.console_rows ? int(m.console_rows) + ' строк выгрузки' : 'выгрузки нет') + '</span></div>' + models + consoleRows + '</div>' +
      '<div class="card panel chart"><div class="panel-head"><h2>CTR по позиции</h2><span class="panel-sub">объём ≈ посетители карточки / CTR(позиция)</span></div>' + ctrChart(g) +
      '<p class="note">Кривую не берут из чужих статей — её подгоняют по своим показам и посетителям на известной позиции (раздел 7). Пока своих данных нет, стоит приор ' + dec(cfg.ctr.prior_ctr1, 2) + ' / p^' + dec(cfg.ctr.prior_alpha, 1) + ', и для оценки объёма он не используется.</p></div>' +
      '</section>';
  }

  function renderHealth(g) {
    var h = g.health, cfg = DATA.config;
    var checks = [];
    var gc = h.geo_check;
    checks.push(gc
      ? { t: 'Язык подсказок гео', s: gc.found ? 'ok' : gc.found === 0 ? 'bad' : 'warn', st: gc.found ? 'совпадает' : gc.found === 0 ? 'не совпадает' : 'не проверено',
          d: gc.error ? esc(gc.error) : '«' + esc(gc.prefix) + '» → ' + esc((gc.suggestions || []).join(' · ') || 'пусто') + ' (ждали «' + esc(gc.expect) + '», ' + date(gc.checked_at) + ')' }
      : { t: 'Язык подсказок гео', s: 'off', st: 'не проверялся', d: 'Нейтральное слово на языке гео должно вернуться в подсказках (раздел 10): <code>node src/kw.js geo-check --geo ' + esc(g.geo) + '</code>' });
    checks.push({ t: 'Прокси в стране', s: 'warn', st: 'не настроены',
      d: 'Все запросы идут с одного IP с параметром страны. Персонализации без входа в аккаунт нет, но для стран вне референса честнее снимать через прокси в самой стране.' });
    var f = h.suggest_fetch_30d;
    var share = f && f.n ? f.failed / f.n : null;
    checks.push({ t: 'Разбор ответов подсказок', s: share == null ? 'off' : share > 0.1 ? 'bad' : 'ok', st: share == null ? 'нет запросов' : pct(share) + ' ошибок',
      d: f && f.n ? int(f.n) + ' обращений за 30 дней. Доля ошибок выше 10 % — признак дрейфа парсера: сервис работает, а данные портятся.' : 'Модуль ещё не обращался к подсказкам сам — score посчитан по префиксам, снятым радаром.' });
    var sr = h.serp;
    checks.push(sr
      ? { t: 'Срезы выдачи', s: sr.empty_pct > 0.1 ? 'bad' : 'ok', st: pct(sr.empty_pct) + ' пустых', d: 'Последний обход радара ' + date(sr.snapshot_date) + ' — признаки топ-10 берутся из него.' }
      : { t: 'Срезы выдачи', s: 'off', st: 'нет обхода', d: 'Признаки выдачи появятся после обхода радара.' });
    var run = h.runs[0];
    if (run) checks.push({ t: 'Последний расчёт score', s: run.status === 'ok' ? 'ok' : 'warn', st: run.status, d: date(run.day) + ': ' + esc(run.notes || '') });
    return checks.map(function (c) {
      return '<div class="check"><span class="check-t">' + c.t + '</span><span class="status s-' + c.s + '">' + esc(c.st) + '</span><div class="check-d">' + c.d + '</div></div>';
    }).join('');
  }

  function renderAccounts(g) {
    var m = g.maturity;
    var rows = [
      { what: 'Google Play Console', stage: 'S2', have: m.console_rows > 0,
        why: 'Единственный источник настоящих цифр: Search terms по стране и запросу. Без него показы не показываются вовсе.',
        how: 'Доступ к Console хотя бы одного приложения (роль с просмотром статистики) и лучше — выгрузка в Cloud Storage. Импорт: <code>import-console</code>.' },
      { what: 'Ещё 2–4 приложения в Console', stage: 'S3', have: m.console_apps >= 3,
        why: 'Бустинг и интервалы требуют приложений разной силы — иначе модель запоминает одно приложение, а не спрос.',
        how: 'Доступ к Console приложений из разных категорий и с разными позициями.' },
      { what: 'Google Ads — Keyword Planner', stage: 'S3', have: m.planner_terms > 0,
        why: 'Объём веб-поиска по стране — один из самых сильных признаков, хоть это и не поиск Play.',
        how: 'Аккаунт Google Ads (без активной кампании отдаёт диапазоны). Выгрузка CSV → <code>import-planner</code>.' },
      { what: 'Google Trends', stage: 'S4', have: m.trends_terms > 0,
        why: 'Форма сезонности: «школьные» и «новогодние» слова не должны выглядеть одинаково в январе и июле.',
        how: 'Аккаунт не нужен: выгрузка multiTimeline.csv по категории → <code>import-trends</code>.' },
      { what: 'Apple Search Ads', stage: 'S3', have: m.asa_terms > 0,
        why: 'Публичная шкала популярности 5–100 для кросс-платформенных запросов — признак модели.',
        how: 'Аккаунт Apple Search Ads. Выгрузка популярности → <code>import-asa</code>.' },
      { what: 'Прокси в странах', stage: 'S1+', have: false,
        why: 'Без прокси в стране подсказки для гео, кроме референсного, могут отражать не ту страну (раздел 10).',
        how: 'Резидентные прокси по нужным гео; до этого проверка языка гео ловит грубые подмены.' },
    ];
    return '<div class="tbl-wrap" style="max-height:none"><table class="acc"><thead><tr><th>Что нужно</th><th>Стадия</th><th>Сейчас</th><th>Зачем</th><th>Как подключить</th></tr></thead><tbody>' +
      rows.map(function (r) {
        return '<tr><td class="what">' + r.what + '</td><td class="stage">' + r.stage + '</td><td>' + (r.have ? '<span class="status s-ok">данные есть</span>' : '<span class="status s-off">нет</span>') + '</td><td class="small">' + r.why + '</td><td class="small">' + r.how + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  // ---------- сборка ----------
  function render() {
    var g = G();
    if (!g) { $('kw-page').innerHTML = '<div class="empty">Данных нет — запустите node src/kw.js run</div>'; return; }
    if (!state.term || !g.keywords.find(function (k) { return k.term === state.term; })) {
      var first = rowsFor(g).find(function (k) { return !k.pending; }) || g.keywords[0];
      state.term = first ? first.term : null;
    }
    $('kw-stamp').textContent = 'расчёт ' + date(g.metrics_day || DATA.meta.date);
    $('kw-page').innerHTML =
      renderHead(g) + renderKpis(g) +
      '<section class="work"><div id="kw-table">' + renderTable(g) + '</div><div id="kw-detail">' + renderDetail(g) + '</div></section>' +
      renderSignal(g) + renderCalibration(g) +
      '<section class="grid2">' +
      '<div class="card panel"><div class="panel-head"><h2>Исправность сбора</h2><span class="panel-sub">то, что ломает оценку тихо</span></div><div class="checks">' + renderHealth(g) + '</div></div>' +
      '<div class="card panel"><div class="panel-head"><h2>Доступы для следующих стадий</h2><span class="panel-sub">без них модуль честно остаётся на порядковой шкале</span></div>' + renderAccounts(g) + '</div>' +
      '</section>';
  }

  function refreshTable() {
    var g = G();
    $('kw-table').innerHTML = renderTable(g);
    var q = $('kw-q');
    if (q && document.activeElement !== q && state.qFocus) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  }
  function refreshDetail() { $('kw-detail').innerHTML = renderDetail(G()); }

  var sel = $('kw-geo');
  sel.innerHTML = DATA.geos.map(function (g) { return '<option value="' + g.geo + '"' + (g.geo === state.geo ? ' selected' : '') + '>' + g.geo + ' · ' + esc(g.name) + '</option>'; }).join('');
  sel.addEventListener('change', function () { state.geo = sel.value; state.term = null; persist(); render(); });

  document.addEventListener('click', function (ev) {
    var t = ev.target;
    var pill = t.closest('[data-filter]');
    if (pill) { state.filter = pill.getAttribute('data-filter'); refreshTable(); return; }
    var sortTh = t.closest('[data-sort]');
    if (sortTh) {
      var key = sortTh.getAttribute('data-sort');
      state.dir = state.sort === key ? -state.dir : (key === 'term' ? 1 : -1);
      state.sort = key; refreshTable(); return;
    }
    var len = t.closest('[data-len]');
    if (len) { state.lenField = len.getAttribute('data-len'); render(); return; }
    var rung = t.closest('[data-rung]');
    if (rung) {
      var i = Number(rung.getAttribute('data-rung'));
      state.open[state.term] = state.open[state.term] === i ? -1 : i;
      refreshDetail(); return;
    }
    var tr = t.closest('tr[data-term]');
    if (tr && G().keywords.find(function (k) { return k.term === tr.getAttribute('data-term'); })) {
      state.term = tr.getAttribute('data-term');
      Array.prototype.forEach.call(document.querySelectorAll('#kw-body tr'), function (row) { row.setAttribute('aria-selected', row === tr); });
      refreshDetail();
      if (window.innerWidth <= 1180) $('kw-detail').scrollIntoView({ block: 'start', behavior: 'smooth' });
      return;
    }
    if (LIVE && t.id === 'kw-estimate-go') estimate();
    if (LIVE && t.id === 'kw-watch-go') watch();
  });
  document.addEventListener('input', function (ev) {
    if (ev.target.id === 'kw-q') { state.q = ev.target.value; state.qFocus = true; refreshTable(); }
  });
  document.addEventListener('focusout', function (ev) { if (ev.target.id === 'kw-q') state.qFocus = false; });
  document.addEventListener('keydown', function (ev) { if (LIVE && ev.target.id === 'kw-estimate' && ev.key === 'Enter') estimate(); });
  document.addEventListener('mousemove', function (ev) {
    var el = ev.target.closest && ev.target.closest('[data-tip]');
    if (el) showTip(el.getAttribute('data-tip'), ev); else hideTip();
  });

  // ---------- локальный сервис ----------
  function msg(text) { var m = $('kw-live-msg'); if (m) m.textContent = text; }
  function reload(term) {
    return fetch('api/data').then(function (r) { return r.json(); }).then(function (json) {
      DATA = unpackRows(json);
      if (term) { state.term = term; state.filter = 'all'; state.q = ''; }
      render();
    });
  }
  function estimate() {
    var input = $('kw-estimate'), btn = $('kw-estimate-go');
    var term = (input.value || '').trim().toLowerCase();
    if (!term) { msg('Введите фразу'); return; }
    btn.disabled = true; msg('Снимаю префиксы «' + term + '» в ' + state.geo + '…');
    fetch('api/estimate', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ geo: state.geo, term: term }) })
      .then(function (r) { return r.json(); })
      .then(function (res) { if (res.error) throw new Error(res.error); return reload(res.term); })
      .catch(function (e) { btn.disabled = false; msg('Не получилось: ' + e.message); });
  }
  function watch() {
    var btn = $('kw-watch-go');
    btn.disabled = true;
    fetch('api/watch', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ geo: state.geo, term: state.term }) })
      .then(function (r) { return r.json(); })
      .then(function (res) { if (res.error) throw new Error(res.error); return reload(state.term); })
      .catch(function (e) { btn.disabled = false; msg('Не получилось: ' + e.message); });
  }

  render();
})();
</script>
