<title>AppRadar 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f4f8; --card: #ffffff; --text: #23262f; --muted: #6f768a;
    --border: #e7e9f1; --hover: #f7f8fc; --head: #fafbfe; --input: #ffffff;
    --side: #171927; --side-2: #232639; --side-text: #cfd3e1; --side-muted: #8b90a6;
    --accent: #3d5afe; --accent-soft: #eaeeff; --green: #148a5b; --green-soft: #e4f7ee;
    --orange: #b86a06; --orange-soft: #fdf1e0; --red: #d23a3e; --red-soft: #fdeaea;
    --purple: #6a4be8; --purple-soft: #efeafe; --neutral: #9aa1b3;
    --shadow: 0 1px 2px rgba(25,28,40,.06), 0 8px 24px rgba(25,28,40,.05);
    --overlay: rgba(16,18,32,.46);
    --f-ui: Manrope, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --f-num: "JetBrains Mono", ui-monospace, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101220; --card: #191c2b; --text: #e8eaf2; --muted: #969db2;
      --border: #262a3b; --hover: #1f2334; --head: #1c2030; --input: #14172a;
      --side: #0c0e18; --side-2: #1a1d2c; --side-text: #cfd3e1; --side-muted: #7d8399;
      --accent: #6d84ff; --accent-soft: #1e2547; --green: #2ecc8f; --green-soft: #14322a;
      --orange: #f0a13a; --orange-soft: #33270f; --red: #f0666a; --red-soft: #351a1c;
      --purple: #a58fff; --purple-soft: #2a2350; --neutral: #5c6378;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.28);
      --overlay: rgba(0,0,0,.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101220; --card: #191c2b; --text: #e8eaf2; --muted: #969db2;
    --border: #262a3b; --hover: #1f2334; --head: #1c2030; --input: #14172a;
    --side: #0c0e18; --side-2: #1a1d2c; --side-text: #cfd3e1; --side-muted: #7d8399;
    --accent: #6d84ff; --accent-soft: #1e2547; --green: #2ecc8f; --green-soft: #14322a;
    --orange: #f0a13a; --orange-soft: #33270f; --red: #f0666a; --red-soft: #351a1c;
    --purple: #a58fff; --purple-soft: #2a2350; --neutral: #5c6378;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.28);
    --overlay: rgba(0,0,0,.6);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--f-ui); font-size: 14px; line-height: 1.45; }
  button { font: inherit; color: inherit; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ::-webkit-scrollbar { height: 10px; width: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(130,140,165,.45); border-radius: 8px; }
  .num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }

  .app { display: flex; min-height: 100vh; }
  .side { width: 244px; flex: 0 0 244px; background: var(--side); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 20px 20px 22px; }
  .brand-mark { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, #3d5afe, #7a5cf0); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 13px; }
  .brand-name { color: #fff; font-weight: 800; font-size: 17px; letter-spacing: -0.3px; }
  .side-label { padding: 0 20px 6px; color: var(--side-muted); font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }
  .side-nav { display: flex; flex-direction: column; gap: 2px; padding: 4px 10px 16px; }
  .nav-item { display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 9px; cursor: pointer; color: var(--side-text); background: transparent; border: 0; text-align: left; font-weight: 600; font-size: 14px; width: 100%; }
  .nav-item:hover { background: var(--side-2); }
  .nav-item[aria-current="page"] { background: #3d5afe; color: #fff; }
  .nav-count { margin-left: auto; background: var(--side-2); color: var(--side-text); border-radius: 20px; padding: 2px 8px; font-size: 11px; font-weight: 700; }
  .nav-item[aria-current="page"] .nav-count { background: rgba(255,255,255,.2); color: #fff; }
  .side-note { margin: 0 20px 16px; color: var(--side-muted); font-size: 12px; line-height: 1.5; }
  .side-note b { color: var(--side-text); }
  .side-foot { margin-top: auto; padding: 16px 18px 20px; border-top: 1px solid rgba(255,255,255,.07); display: flex; align-items: center; gap: 10px; }
  .side-avatar { width: 32px; height: 32px; border-radius: 50%; background: #2b3047; color: #cfd3e1; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px; font-family: var(--f-num); flex: 0 0 32px; }
  .side-foot-title { color: #fff; font-size: 13px; font-weight: 700; }
  .side-foot-sub { color: var(--side-muted); font-size: 11.5px; }

  main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar { position: sticky; top: 0; z-index: 20; background: var(--card); border-bottom: 1px solid var(--border); padding: 14px 26px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .search { display: flex; align-items: center; gap: 9px; background: var(--hover); border: 1px solid var(--border); border-radius: 10px; padding: 9px 13px; flex: 1 1 320px; min-width: 220px; max-width: 520px; }
  .search input { border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; width: 100%; }
  .search:focus-within { border-color: var(--accent); }
  .top-right { display: flex; align-items: center; gap: 10px; margin-left: auto; flex-wrap: wrap; }
  .chip-btn { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); font-weight: 700; font-size: 13px; cursor: pointer; }
  .chip-btn:hover { border-color: var(--accent); }
  .chip-static { cursor: default; }
  .chip-static:hover { border-color: var(--border); }
  .geo-code { background: var(--accent-soft); color: var(--accent); border-radius: 5px; padding: 2px 6px; font-size: 11px; font-weight: 800; font-family: var(--f-num); }
  .geo-wrap { position: relative; }
  .geo-menu { position: absolute; right: 0; top: 46px; width: 280px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); padding: 6px; z-index: 40; max-height: 440px; overflow-y: auto; }
  .geo-opt { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; width: 100%; border: 0; background: transparent; text-align: left; }
  .geo-opt:hover, .geo-opt[aria-selected="true"] { background: var(--hover); }
  .geo-opt[aria-selected="true"] { color: var(--accent); }
  .geo-opt .code { font-family: var(--f-num); font-size: 11px; font-weight: 800; color: var(--muted); width: 26px; }
  .geo-opt .cnt { margin-left: auto; color: var(--muted); font-size: 12px; font-family: var(--f-num); }
  .icon-btn { width: 38px; height: 37px; border: 1px solid var(--border); border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; background: var(--card); padding: 0; }
  .icon-btn:hover { border-color: var(--accent); }

  .page { padding: 26px; display: flex; flex-direction: column; gap: 18px; }
  .page-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .eyebrow { color: var(--accent); font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px; }
  h1 { margin: 0 0 6px; font-size: 25px; font-weight: 800; letter-spacing: -0.5px; text-wrap: balance; }
  .lead { margin: 0; color: var(--muted); font-size: 13.5px; max-width: 78ch; text-wrap: pretty; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); }
  .kpi { padding: 16px 18px; border-radius: 13px; }
  .kpi-label { color: var(--muted); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
  .kpi-row { display: flex; align-items: baseline; gap: 9px; margin-top: 9px; flex-wrap: wrap; }
  .kpi-value { font-size: 24px; font-weight: 800; font-family: var(--f-num); letter-spacing: -1px; }
  .kpi-delta { font-size: 12.5px; font-weight: 800; }
  .kpi-hint { color: var(--muted); font-size: 12px; margin-top: 4px; }

  .toolbar { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .toolbar.first { background: var(--head); }
  .pill { padding: 7px 13px; border-radius: 20px; cursor: pointer; font-size: 12.5px; font-weight: 700; background: var(--card); color: var(--text); border: 1px solid var(--border); }
  .pill:hover { border-color: var(--accent); }
  .pill[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  .toolbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  select, .inp { padding: 8px 10px; border: 1px solid var(--border); border-radius: 9px; background: var(--input); color: var(--text); font: inherit; font-size: 13px; font-weight: 600; }
  .check { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; cursor: pointer; user-select: none; }
  .check input { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }
  .field { display: inline-flex; align-items: center; gap: 6px; }
  .field label { color: var(--muted); font-size: 12px; font-weight: 700; }
  .filter-chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 6px 5px 11px; border-radius: 20px; background: var(--accent-soft); color: var(--accent); font-weight: 800; font-size: 12.5px; }
  .filter-chip button { border: 0; background: transparent; cursor: pointer; color: inherit; font-weight: 800; padding: 0 5px; }

  .tbl-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  thead tr { background: var(--head); }
  th { text-align: left; padding: 12px 10px; font-size: 11.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; }
  th:first-child { padding-left: 16px; }
  th:last-child { padding-right: 16px; }
  td { padding: 10px; font-size: 13px; vertical-align: middle; }
  td:first-child { padding-left: 16px; }
  td:last-child { padding-right: 16px; }
  tbody tr { border-top: 1px solid var(--border); }
  tbody tr:hover { background: var(--hover); }
  tr.hl { background: var(--green-soft); }
  .r { text-align: right; }
  .muted { color: var(--muted); }
  .small { font-size: 11.5px; }
  .strong { font-weight: 700; }
  .nowrap { white-space: nowrap; }

  .app-cell { display: flex; align-items: center; gap: 11px; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; min-width: 0; }
  .app-icon { width: 36px; height: 36px; border-radius: 9px; flex: 0 0 36px; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; }
  .app-name { font-weight: 700; font-size: 13.5px; }
  .app-cell:hover .app-name { color: var(--accent); }
  .app-pkg { color: var(--muted); font-size: 11.5px; font-family: var(--f-num); overflow: hidden; text-overflow: ellipsis; max-width: 250px; white-space: nowrap; }
  .niche-cell { cursor: pointer; background: none; border: 0; padding: 0; text-align: left; min-width: 0; }
  .niche-cell:hover .strong { color: var(--accent); }
  .star { cursor: pointer; background: none; border: 0; padding: 0; display: flex; color: var(--neutral); }
  .star[aria-pressed="true"] { color: var(--orange); }
  .tag { padding: 4px 9px; border-radius: 6px; background: var(--hover); border: 1px solid var(--border); font-size: 12px; font-weight: 600; white-space: nowrap; }
  .badge { padding: 3px 9px; border-radius: 6px; font-size: 12px; font-weight: 800; white-space: nowrap; display: inline-block; }
  .b-green { background: var(--green-soft); color: var(--green); }
  .b-orange { background: var(--orange-soft); color: var(--orange); }
  .b-red { background: var(--red-soft); color: var(--red); }
  .b-purple { background: var(--purple-soft); color: var(--purple); }
  .b-accent { background: var(--accent-soft); color: var(--accent); }
  .b-muted { background: var(--hover); color: var(--muted); border: 1px solid var(--border); }
  .meter { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
  .meter-track { width: 60px; height: 6px; border-radius: 4px; background: var(--border); overflow: hidden; }
  .meter-fill { height: 6px; }
  .meter-val { font-family: var(--f-num); font-weight: 800; font-size: 13px; width: 26px; text-align: right; }
  .checks { display: inline-flex; gap: 3px; }
  .chk { width: 12px; height: 12px; border-radius: 3px; display: inline-block; flex: 0 0 12px; }
  .chk-1 { background: var(--green); }
  .chk-0 { background: var(--red); }
  .chk-n { background: transparent; border: 1.5px solid var(--neutral); }
  .chk-b { outline: 1.5px dashed var(--accent); outline-offset: 1px; }

  .pager { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .pager-btns { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  .pg { min-width: 32px; height: 32px; padding: 0 8px; display: flex; align-items: center; justify-content: center; border-radius: 8px; cursor: pointer; font-size: 12.5px; font-weight: 700; background: var(--card); color: var(--text); border: 1px solid var(--border); }
  .pg[aria-current="page"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  .pg:disabled { opacity: .45; cursor: default; }

  .split { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 14px; }
  .panel { padding: 18px; }
  .panel-title { font-weight: 800; font-size: 15px; }
  .panel-sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; text-wrap: pretty; }
  .chart { width: 100%; height: auto; display: block; margin-top: 14px; }
  .chart text { font-family: var(--f-num); font-size: 11px; fill: var(--muted); }
  .chart .val { fill: var(--text); font-weight: 700; }
  .chart .grid { stroke: var(--border); stroke-width: 1; }
  .bars { display: flex; flex-direction: column; gap: 11px; margin-top: 12px; }
  .bar-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 5px; }
  .bar-label { font-size: 13px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-val { margin-left: auto; font-family: var(--f-num); font-size: 12.5px; font-weight: 700; white-space: nowrap; }
  .bar-track { height: 7px; border-radius: 5px; background: var(--border); overflow: hidden; }
  .bar-fill { height: 7px; }
  .table-head { display: flex; align-items: center; gap: 12px; padding: 15px 18px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .note { color: var(--muted); font-size: 12.5px; text-wrap: pretty; }
  .empty { padding: 40px 24px; text-align: center; color: var(--muted); }
  .dashed { border: 1px dashed var(--border); border-radius: 14px; background: var(--card); }

  /* ---------- матрица решения ---------- */
  .matrix-wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(250px, 320px); gap: 14px; }
  .matrix { display: grid; grid-template-columns: 34px 1fr 1fr; grid-template-rows: 1fr 1fr 28px; gap: 8px; padding: 16px; }
  .mx-axis { color: var(--muted); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; display: flex; align-items: center; justify-content: center; }
  .mx-axis.y { writing-mode: vertical-rl; transform: rotate(180deg); }
  .mx-cell { border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; text-align: left; cursor: pointer; background: var(--card); display: flex; flex-direction: column; gap: 4px; min-height: 104px; }
  .mx-cell:hover { border-color: var(--accent); }
  .mx-cell[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft) inset; }
  .mx-count { font-family: var(--f-num); font-weight: 800; font-size: 26px; letter-spacing: -1px; }
  .mx-name { font-weight: 800; font-size: 13.5px; }
  .mx-what { color: var(--muted); font-size: 12px; text-wrap: pretty; }
  .mx-cell.target { background: var(--green-soft); }
  .mx-cell.target .mx-count, .mx-cell.target .mx-name { color: var(--green); }
  .mx-cell.bought .mx-count, .mx-cell.bought .mx-name { color: var(--orange); }
  .mx-cell.mature .mx-count, .mx-cell.mature .mx-name { color: var(--accent); }
  .mx-cell.pass .mx-count, .mx-cell.pass .mx-name { color: var(--muted); }

  /* ---------- четыре числа ниши ---------- */
  .four { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; }
  .four > div { padding: 14px 16px; border-right: 1px solid var(--border); }
  .four > div:last-child { border-right: 0; }
  .four-label { color: var(--muted); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; }
  .four-val { font-family: var(--f-num); font-weight: 800; font-size: 22px; letter-spacing: -0.8px; margin-top: 6px; }
  .four-hint { color: var(--muted); font-size: 11.5px; margin-top: 2px; }

  .overlay { position: fixed; inset: 0; background: var(--overlay); z-index: 60; display: flex; justify-content: flex-end; }
  .drawer { width: min(720px, 100%); height: 100%; background: var(--bg); overflow-y: auto; box-shadow: var(--shadow); }
  .drawer-head { position: sticky; top: 0; background: var(--card); border-bottom: 1px solid var(--border); padding: 18px 22px; display: flex; gap: 14px; align-items: center; z-index: 2; }
  .drawer-body { padding: 20px 22px 40px; display: flex; flex-direction: column; gap: 14px; }
  .check-list { display: flex; flex-direction: column; }
  .check-row { display: grid; grid-template-columns: 14px 1fr auto; gap: 4px 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--border); font-size: 13.5px; }
  .check-row:first-child { border-top: 0; }
  .check-row .why { grid-column: 2 / 4; color: var(--muted); font-size: 12px; font-family: var(--f-num); }
  .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 18px; margin-top: 12px; }
  .kv dt { color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
  .kv dd { margin: 2px 0 0; font-family: var(--f-num); font-weight: 700; font-size: 13px; overflow-wrap: anywhere; }
  .mini { width: 100%; border-collapse: collapse; margin-top: 10px; }
  .mini th, .mini td { padding: 7px 8px; font-size: 12.5px; }
  .mini th:first-child, .mini td:first-child { padding-left: 0; }
  .mini th:last-child, .mini td:last-child { padding-right: 0; }
  .mini thead tr { background: transparent; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .btn { padding: 8px 13px; border-radius: 9px; border: 1px solid var(--border); background: var(--card); font-weight: 700; font-size: 13px; cursor: pointer; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .calc { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 12px; }
  .calc label { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
  .calc .inp { font-family: var(--f-num); width: 100%; }
  .calc-out { margin-top: 12px; padding: 12px 14px; border-radius: 10px; background: var(--hover); border: 1px solid var(--border); font-size: 13px; }
  .calc-out b { font-family: var(--f-num); }
  .manual li { margin: 6px 0; }

  .ready-table td .badge { font-size: 11.5px; }
  .fav-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
  .fav-card { padding: 16px; }
  .trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
  .trio-label { color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; }
  .trio-val { font-family: var(--f-num); font-weight: 700; font-size: 13px; }

  .cal { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 8px; padding: 16px; }
  .cal-day { border: 1px solid var(--border); border-radius: 10px; padding: 8px; min-height: 84px; background: var(--card); }
  .cal-day.today { border-color: var(--accent); background: var(--accent-soft); }
  .cal-day.weekend { background: var(--hover); }
  .cal-dn { display: flex; justify-content: space-between; font-family: var(--f-num); font-size: 11px; color: var(--muted); }
  .cal-dn b { color: var(--text); }

  var READY = { 'собрано': 'b-green', 'собирается': 'b-orange', 'недостаточно': 'b-red', 'нет данных': 'b-muted' };
  var WD = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
  function niceMax(v) { if (!(v > 0)) return 1; var p = Math.pow(10, Math.floor(Math.log10(v))), n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
  function columns(items) {
    var W = 640, H = 230, L = 52, R = 10, T = 22, B = 36, n = items.length || 1, cw = (W - L - R) / n, bw = Math.min(40, cw * 0.62);
    var mx = niceMax(Math.max.apply(null, items.map(function (i) { return i.value || 0; }).concat([1]))), ph = H - T - B;
    var s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="карточек по дням">';
    for (var k = 0; k <= 4; k++) { var t = mx * k / 4, y = T + ph - (t / mx) * ph; s += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '"/><text x="' + (L - 8) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="end">' + short(t) + '</text>'; }
    items.forEach(function (it, i) {
      var h = Math.max(it.value > 0 ? 2 : 0, (it.value / mx) * ph), x = L + cw * i + (cw - bw) / 2, y = T + ph - h;
      s += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="5" style="fill:var(--accent)"><title>' + esc(it.label + ': ' + int(it.value)) + '</title></rect>';
      s += '<text class="val" x="' + (x + bw / 2).toFixed(1) + '" y="' + (y - 6).toFixed(1) + '" text-anchor="middle">' + short(it.value) + '</text><text x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - B + 18) + '" text-anchor="middle">' + esc(it.label) + '</text>';
    });
    return s + '</svg>';
  }
  function etaCell(g, need) {
    if (!g.date) return dash();
    var have = g.history_days || 0;
    return have >= need ? '<span class="badge b-green">✓ ' + have + ' дн.</span>' : '<span class="num small">с ' + esc(dmy(addDays(g.date, need - have)).slice(0, 5)) + '</span> <span class="muted small">(' + have + '/' + need + ')</span>';
  }
  function covBadge(v) { return isNum(v) ? '<span class="badge num ' + (v >= 0.9 ? 'b-green' : v >= 0.6 ? 'b-orange' : 'b-red') + '">' + pct(v) + '</span>' : dash(); }
  function renderCollection() {
    var C = D.collection, byDate = {};
    D.timeline.forEach(function (t) { byDate[t.date] = (byDate[t.date] || 0) + t.cards; });
    var dates = Object.keys(byDate).sort();
    var geos = D.geos.filter(function (g) { return matchesQ([g.geo, GEO_NAMES[g.geo]]); });
    var count = function (r) { return C.status.filter(function (s) { return s.readiness === r; }).length; };
    var withK = D.geos.filter(function (g) { return isNum(g.k_geo); }).length;
    var expiring = D.geos.reduce(function (s, g) { return s + (g.expiring7 || 0); }, 0);
    var cal = C.plan.map(function (day, i) {
      var marks = [];
      if (day.items.some(function (it) { return it.kind === 'light_crawl'; })) marks.push('<span class="mark light">D1+D2</span>');
      day.items.forEach(function (it) {
        if (it.kind === 'full_crawl') marks.push('<span class="mark full">' + esc(it.geo) + '</span>');
        if (it.kind === 'k7_a') marks.push('<span class="mark k7">K7·A</span>');
        if (it.kind === 'k7_b') marks.push('<span class="mark k7">K7·B</span>');
        if (it.kind === 'monthly') marks.push('<span class="mark month">10.6</span>');
      });
      var weekend = day.weekday === 0 || day.weekday === 6;
      return '<div class="cal-day' + (i === 0 ? ' today' : weekend ? ' weekend' : '') + '"><div class="cal-dn"><b>' + day.date.slice(8, 10) + '.' + day.date.slice(5, 7) + '</b><span>' + WD[day.weekday] + '</span></div><div class="marks">' + marks.join('') + '</div></div>';
    }).join('');
    $('view').innerHTML = '<section class="page">' +
      pageHead('', 'Сбор и планы', 'Что уже собрано, какие величины методики v2.0 считаются и когда включатся остальные. Величины, которым нужна история, пусты с подписью «копится» — не нули.') +
      kpiCards([
        { label: 'Гео собрано сегодня', value: String(count('собрано')), delta: 'из ' + C.status.length, hint: 'все обязательные стадии дня закрыты' },
        { label: 'Курс «спрос → установки»', value: withK + ' из ' + D.geos.length, hint: 'нужно окно ' + M.min_window + ' дн. и ' + M.calib_min + ' органиков в топ-10' },
        { label: 'Улики протухнут за 7 дней', value: int(expiring), hint: 'проверка рекламы старше ' + (M.ttl - 7) + ' дн.: нужна перепроверка' },
        { label: 'Возраст известен', value: pct(median(D.geos.map(function (g) { return g.age_cov; }))), hint: 'медиана по гео, цель ≥ 95 %' }
      ]) +
      '<div class="card" style="overflow:hidden"><div class="table-head"><div class="panel-title">Готовность методики v2.0 по гео</div><span class="note" style="margin-left:auto">окна считаются от первого снимка выдачи гео; «с дд.мм» — если гео снимается каждый день</span></div>' +
        tableHtml([
          { t: 'Гео', v: function (g) { return '<span class="geo-code">' + g.geo + '</span> <span class="strong">' + esc(GEO_NAMES[g.geo] || g.geo) + '</span>'; } },
          { t: 'Снимок', cls: 'num', v: function (g) { return esc(dmy(g.date)); } },
          { t: 'Курс, 3b, прирост', title: 'окно ' + M.min_window + ' дней', v: function (g) { return isNum(g.k_geo) ? '<span class="badge b-green">курс ' + fix(g.k_geo, 1) + '</span>' : etaCell(g, M.min_window); } },
          { t: 'Оборот, 30 дн.', v: function (g) { return etaCell(g, M.full_window); } },
          { t: 'Входы, 90 дн.', v: function (g) { return etaCell(g, M.entry_window); } },
          { t: 'Возраст', r: true, v: function (g) { return covBadge(g.age_cov); } },
          { t: 'door', r: true, v: function (g) { return covBadge(g.door_cov); } },
          { t: 'Свобода', r: true, v: function (g) { return covBadge(g.freedom_cov); } },
          { t: 'Чистота', r: true, v: function (g) { return covBadge(g.purity_cov); } },
          { t: 'Реклама', r: true, title: 'доля прошедших воронку с известной ступенью органики', v: function (g) { return covBadge(g.ads_cov); } },
          { t: 'Протухнут · протухли', r: true, cls: 'num', v: function (g) { return int(g.expiring7) + ' · ' + int(g.stale); } }
        ], geos, { minWidth: 1180, cls: 'ready-table' }) + '</div>' +
      '<div class="split">' +
        '<div class="card panel"><div class="panel-title">Снято карточек по дням</div><div class="panel-sub">сумма по всем гео</div>' + columns(dates.map(function (dt) { return { label: dt.slice(8, 10) + '.' + dt.slice(5, 7), value: byDate[dt] }; })) + '</div>' +
        '<div class="card panel"><div class="panel-title">Готовность дня</div><div class="panel-sub">правило последнего полного дня</div>' +
          '<div class="bars">' + C.status.filter(function (s) { return matchesQ([s.geo, GEO_NAMES[s.geo]]); }).map(function (s) {
            return '<div class="bar-head"><span class="geo-code">' + s.geo + '</span><span class="bar-label">' + esc(s.why) + '</span><span class="bar-val"><span class="badge ' + (READY[s.readiness] || 'b-muted') + '">' + esc(s.readiness) + '</span></span></div>';
          }).join('') + '</div></div>' +
      '</div>' +
      '<div class="card" style="overflow:hidden"><div class="table-head"><div class="panel-title">План на месяц</div><span class="note" style="margin-left:auto">' + C.plan.length + ' дней вперёд</span></div>' +
        '<div class="cal">' + cal + '</div><div class="legend"><span><span class="mark full">US</span> полный обход гео</span><span><span class="mark light">D1+D2</span> облегчённый обход</span><span><span class="mark k7">K7</span> проверка рекламных библиотек</span><span><span class="mark month">10.6</span> месячная задача</span></div></div>' +
      '<div class="card" style="overflow:hidden"><div class="table-head"><div class="panel-title">Гео</div><span class="note" style="margin-left:auto">референс — ' + REF + ' · деньги гео — приоры справочника, не измерения</span></div>' +
        tableHtml([
          { t: 'Гео', v: function (g) { return '<span class="geo-code">' + g.geo + '</span> <span class="strong">' + esc(GEO_NAMES[g.geo] || g.geo) + '</span>' + (g.is_reference ? ' <span class="badge b-accent">референс</span>' : ''); } },
          { t: 'Тир', r: true, cls: 'num', v: function (g) { return g.tier; } },
          { t: 'Снимков', r: true, cls: 'num', v: function (g) { return g.snapshots; } },
          { t: 'Найдено', r: true, cls: 'num', v: function (g) { return int(g.discovered); } },
          { t: 'Ключей', r: true, cls: 'num', v: function (g) { return int(g.keywords_total); } },
          { t: 'Ниш', r: true, cls: 'num', v: function (g) { return int(g.niches); } },
          { t: 'Прошли воронку', r: true, cls: 'num strong', v: function (g) { return int(g.apps); } },
          { t: 'Деньги к US', r: true, cls: 'num', v: function (g) { return fix(g.money_ratio, 2); } }
        ], geos, { minWidth: 860 }) + '</div>' +
    '</section>';
  }

  // ---------------- отрисовка и события ----------------
  function render() {
    renderNav(); renderHeader();
    if (state.view === 'apps') renderApps();
    else if (state.view === 'niches') renderNiches();
    else if (state.view === 'fav') renderFav();
    else renderCollection();
  }
  document.addEventListener('click', function (e) {
    var menu = $('geo-menu');
    if (!e.target.closest('.geo-wrap')) { menu.hidden = true; $('geo-btn').setAttribute('aria-expanded', 'false'); }
    if (e.target.closest('#geo-btn')) { menu.hidden = !menu.hidden; $('geo-btn').setAttribute('aria-expanded', String(!menu.hidden)); return; }
    if (e.target.closest('#theme-btn')) { var next = isDark() ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', next); save('appradar-theme', next); renderHeader(); return; }
    var t = e.target.closest('[data-act]');
    if (!t) return;
    var act = t.getAttribute('data-act');
    if (t.tagName === 'INPUT' || t.tagName === 'SELECT') return;
    if (act === 'close') { if (t.classList.contains('overlay') && e.target.closest('[data-stop]')) return; closeDrawer(); return; }
    if (act === 'view') { state.view = t.getAttribute('data-view'); state.page = 1; closeDrawer(); render(); window.scrollTo(0, 0); return; }
    if (act === 'geo') { state.geo = t.getAttribute('data-geo'); state.page = 1; state.af.cat = 'all'; state.nf.cat = 'all'; menu.hidden = true; render(); return; }
    if (act === 'page') { state.page = Number(t.getAttribute('data-page')); render(); var head = document.querySelector('.card .toolbar'); if (head) head.scrollIntoView({ block: 'start' }); return; }
    if (act === 'af-cat') { state.af.cat = t.getAttribute('data-cat'); state.page = 1; render(); return; }
    if (act === 'nf-cat') { state.nf.cat = t.getAttribute('data-cat'); state.page = 1; render(); return; }
    if (act === 'nf-quad') { var qd = t.getAttribute('data-quad'); state.nf.quad = state.nf.quad === qd ? 'all' : qd; state.page = 1; render(); return; }
    if (act === 'clear-niche') { state.af.niche = null; state.page = 1; render(); return; }
    if (act === 'fav') {
      var kind = t.getAttribute('data-kind'), id = t.getAttribute('data-id'), list = kind === 'n' ? state.nfavs : state.favs, i = list.indexOf(id);
      if (i >= 0) list.splice(i, 1); else list.push(id);
      save(kind === 'n' ? 'appradar2-nfavs' : 'appradar2-favs', list);
      t.setAttribute('aria-pressed', String(i < 0)); t.querySelector('svg').setAttribute('fill', i < 0 ? 'currentColor' : 'none');
      renderNav(); if (state.view === 'fav' && !e.target.closest('.drawer')) renderFav();
      return;
    }
    if (act === 'open-app') { openApp(t.getAttribute('data-app'), t.getAttribute('data-geo')); return; }
    if (act === 'open-niche') { $('drawer-root').removeAttribute('data-app'); openNiche(t.getAttribute('data-geo'), t.getAttribute('data-niche')); return; }
    if (act === 'niche-apps') {
      var ng = t.getAttribute('data-geo'), nid = t.getAttribute('data-niche'), nn = nicheByKey[ng + '|' + nid];
      state.view = 'apps'; state.page = 1;
      if (state.geo === WW && nn.concept) state.af.niche = { concept: nn.concept, label: nn.concept };
      else { state.geo = ng; state.af.niche = { geo: ng, niche_id: nid, label: (nn.concept || nn.head) + ' · ' + ng }; }
      closeDrawer(); render(); window.scrollTo(0, 0); return;
    }
  });
  document.addEventListener('change', function (e) {
    var t = e.target, act = t.getAttribute('data-act');
    if (act === 'hide-paid') { state.hidePaid = t.checked; save('appradar2-hide-paid', state.hidePaid); state.page = 1; render(); return; }
    if (act === 'show-disq') { state.showDisq = t.checked; state.page = 1; render(); return; }
    if (act === 'af') { var k = t.getAttribute('data-key'); state.af[k] = k === 'minPassed' ? Number(t.value) : t.value; state.page = 1; render(); return; }
    if (act === 'nf') { state.nf[t.getAttribute('data-key')] = t.value; state.page = 1; render(); return; }
    if (act === 'nf-check') { state.nf[t.getAttribute('data-key')] = t.checked; state.page = 1; render(); return; }
  });
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.getAttribute('data-act') !== 'calc') return;
    var c = load('appradar2-calc', {}); c[t.getAttribute('data-key')] = t.value; save('appradar2-calc', c);
    var root = $('drawer-root'), a = appByKey[root.getAttribute('data-geo') + '|' + root.getAttribute('data-app')];
    if (a && $('calc-out')) $('calc-out').innerHTML = calcOut(a);
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeDrawer(); $('geo-menu').hidden = true; } });
  var qTimer = null;
  $('q').addEventListener('input', function (e) { clearTimeout(qTimer); qTimer = setTimeout(function () { state.q = e.target.value.trim(); state.page = 1; render(); }, 160); });
  if (window.matchMedia) { var mq = window.matchMedia('(prefers-color-scheme: dark)'); if (mq.addEventListener) mq.addEventListener('change', renderHeader); }
  render();
})();
</script>
