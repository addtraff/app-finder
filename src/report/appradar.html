<title>AppRadar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f4f8; --card: #ffffff; --text: #23262f; --muted: #6f768a;
    --border: #e7e9f1; --hover: #f7f8fc; --head: #fafbfe; --input: #ffffff;
    --side: #171927; --side-2: #232639; --side-text: #cfd3e1; --side-muted: #8b90a6;
    --accent: #3d5afe; --accent-soft: #eaeeff; --green: #148a5b; --green-soft: #e4f7ee;
    --orange: #b86a06; --orange-soft: #fdf1e0; --red: #d23a3e; --red-soft: #fdeaea;
    --purple: #6a4be8; --purple-soft: #efeafe; --neutral: #9aa1b3;
    --shadow: 0 1px 2px rgba(25,28,40,.06), 0 8px 24px rgba(25,28,40,.05);
    --overlay: rgba(16,18,32,.46);
    --f-ui: Manrope, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --f-num: "JetBrains Mono", ui-monospace, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101220; --card: #191c2b; --text: #e8eaf2; --muted: #969db2;
      --border: #262a3b; --hover: #1f2334; --head: #1c2030; --input: #14172a;
      --side: #0c0e18; --side-2: #1a1d2c; --side-text: #cfd3e1; --side-muted: #7d8399;
      --accent: #6d84ff; --accent-soft: #1e2547; --green: #2ecc8f; --green-soft: #14322a;
      --orange: #f0a13a; --orange-soft: #33270f; --red: #f0666a; --red-soft: #351a1c;
      --purple: #a58fff; --purple-soft: #2a2350; --neutral: #5c6378;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.28);
      --overlay: rgba(0,0,0,.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101220; --card: #191c2b; --text: #e8eaf2; --muted: #969db2;
    --border: #262a3b; --hover: #1f2334; --head: #1c2030; --input: #14172a;
    --side: #0c0e18; --side-2: #1a1d2c; --side-text: #cfd3e1; --side-muted: #7d8399;
    --accent: #6d84ff; --accent-soft: #1e2547; --green: #2ecc8f; --green-soft: #14322a;
    --orange: #f0a13a; --orange-soft: #33270f; --red: #f0666a; --red-soft: #351a1c;
    --purple: #a58fff; --purple-soft: #2a2350; --neutral: #5c6378;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.28);
    --overlay: rgba(0,0,0,.6);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--f-ui); font-size: 14px; line-height: 1.45; }
  button { font: inherit; color: inherit; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ::-webkit-scrollbar { height: 10px; width: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(130,140,165,.45); border-radius: 8px; }
  .num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }

  .app { display: flex; min-height: 100vh; }

  /* ---------- меню ---------- */
  .side { width: 244px; flex: 0 0 244px; background: var(--side); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 20px 20px 22px; }
  .brand-mark { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, #3d5afe, #7a5cf0); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 14px; }
  .brand-name { color: #fff; font-weight: 800; font-size: 17px; letter-spacing: -0.3px; }
  .side-label { padding: 0 20px 6px; color: var(--side-muted); font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }
  .side-nav { display: flex; flex-direction: column; gap: 2px; padding: 4px 10px 16px; }
  .nav-item { display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 9px; cursor: pointer; color: var(--side-text); background: transparent; border: 0; text-align: left; font-weight: 600; font-size: 14px; width: 100%; }
  .nav-item:hover { background: var(--side-2); }
  .nav-item[aria-current="page"] { background: #3d5afe; color: #fff; }
  .nav-item.sub { font-size: 13.5px; padding: 9px 12px; gap: 10px; }
  .nav-dot { width: 6px; height: 6px; border-radius: 50%; flex: 0 0 6px; }
  .nav-count { margin-left: auto; background: var(--side-2); color: var(--side-text); border-radius: 20px; padding: 2px 8px; font-size: 11px; font-weight: 700; }
  .nav-item[aria-current="page"] .nav-count { background: rgba(255,255,255,.2); color: #fff; }
  .side-foot { margin-top: auto; padding: 16px 18px 20px; border-top: 1px solid rgba(255,255,255,.07); display: flex; align-items: center; gap: 10px; }
  .side-avatar { width: 32px; height: 32px; border-radius: 50%; background: #2b3047; color: #cfd3e1; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px; font-family: var(--f-num); flex: 0 0 32px; }
  .side-foot-title { color: #fff; font-size: 13px; font-weight: 700; }
  .side-foot-sub { color: var(--side-muted); font-size: 11.5px; }

  /* ---------- шапка ---------- */
  main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar { position: sticky; top: 0; z-index: 20; background: var(--card); border-bottom: 1px solid var(--border); padding: 14px 26px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .search { display: flex; align-items: center; gap: 9px; background: var(--hover); border: 1px solid var(--border); border-radius: 10px; padding: 9px 13px; flex: 1 1 320px; min-width: 220px; max-width: 520px; }
  .search input { border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; width: 100%; }
  .search:focus-within { border-color: var(--accent); }
  .top-right { display: flex; align-items: center; gap: 10px; margin-left: auto; flex-wrap: wrap; }
  .chip-btn { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); font-weight: 700; font-size: 13px; cursor: pointer; }
  .chip-btn:hover { border-color: var(--accent); }
  .chip-static { cursor: default; }
  .chip-static:hover { border-color: var(--border); }
  .geo-code { background: var(--accent-soft); color: var(--accent); border-radius: 5px; padding: 2px 6px; font-size: 11px; font-weight: 800; font-family: var(--f-num); }
  .geo-wrap { position: relative; }
  .geo-menu { position: absolute; right: 0; top: 46px; width: 270px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); padding: 6px; z-index: 40; max-height: 420px; overflow-y: auto; }
  .geo-opt { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; width: 100%; border: 0; background: transparent; text-align: left; }
  .geo-opt:hover, .geo-opt[aria-selected="true"] { background: var(--hover); }
  .geo-opt[aria-selected="true"] { color: var(--accent); }
  .geo-opt .code { font-family: var(--f-num); font-size: 11px; font-weight: 800; color: var(--muted); width: 24px; }
  .geo-opt .cnt { margin-left: auto; color: var(--muted); font-size: 12px; font-family: var(--f-num); }
  .icon-btn { width: 38px; height: 37px; border: 1px solid var(--border); border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; background: var(--card); padding: 0; }
  .icon-btn:hover { border-color: var(--accent); }

  /* ---------- содержимое ---------- */
  .page { padding: 26px; display: flex; flex-direction: column; gap: 18px; }
  .page-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .eyebrow { color: var(--accent); font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px; }
  h1 { margin: 0 0 6px; font-size: 25px; font-weight: 800; letter-spacing: -0.5px; text-wrap: balance; }
  .lead { margin: 0; color: var(--muted); font-size: 13.5px; max-width: 70ch; text-wrap: pretty; }
  .head-side { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  .mini-label { color: var(--muted); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  .seg { display: flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--card); flex-wrap: wrap; }
  .seg button { padding: 8px 12px; cursor: pointer; font-size: 12.5px; font-weight: 800; font-family: var(--f-num); background: transparent; border: 0; border-right: 1px solid var(--border); color: var(--text); }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); }
  .kpi { padding: 16px 18px; border-radius: 13px; }
  .kpi-label { color: var(--muted); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
  .kpi-row { display: flex; align-items: baseline; gap: 9px; margin-top: 9px; }
  .kpi-value { font-size: 24px; font-weight: 800; font-family: var(--f-num); letter-spacing: -1px; }
  .kpi-delta { font-size: 12.5px; font-weight: 800; }
  .kpi-hint { color: var(--muted); font-size: 12px; margin-top: 4px; }

  .toolbar { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .pill { padding: 7px 13px; border-radius: 20px; cursor: pointer; font-size: 12.5px; font-weight: 700; background: var(--card); color: var(--text); border: 1px solid var(--border); }
  .pill:hover { border-color: var(--accent); }
  .pill[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  .toolbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  select { padding: 8px 10px; border: 1px solid var(--border); border-radius: 9px; background: var(--card); color: var(--text); font: inherit; font-size: 13px; font-weight: 600; }

  .tbl-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  thead tr { background: var(--head); }
  th { text-align: left; padding: 12px 10px; font-size: 11.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; }
  th:first-child { padding-left: 16px; }
  th:last-child { padding-right: 16px; }
  td { padding: 10px; font-size: 13px; vertical-align: middle; }
  td:first-child { padding-left: 16px; }
  td:last-child { padding-right: 16px; }
  tbody tr { border-top: 1px solid var(--border); }
  tbody tr:hover { background: var(--hover); }
  .r { text-align: right; }
  .muted { color: var(--muted); }
  .small { font-size: 11.5px; }
  .strong { font-weight: 700; }
  .nowrap { white-space: nowrap; }

  .app-cell { display: flex; align-items: center; gap: 11px; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; min-width: 0; }
  .app-icon { width: 36px; height: 36px; border-radius: 9px; flex: 0 0 36px; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; }
  .app-name { font-weight: 700; font-size: 13.5px; }
  .app-cell:hover .app-name { color: var(--accent); }
  .app-pkg { color: var(--muted); font-size: 11.5px; font-family: var(--f-num); overflow: hidden; text-overflow: ellipsis; max-width: 260px; white-space: nowrap; }
  .star { cursor: pointer; background: none; border: 0; padding: 0; display: flex; color: var(--neutral); }
  .star[aria-pressed="true"] { color: var(--orange); }
  .tag { padding: 4px 9px; border-radius: 6px; background: var(--hover); border: 1px solid var(--border); font-size: 12px; font-weight: 600; white-space: nowrap; }
  .badge { padding: 3px 9px; border-radius: 6px; font-size: 12px; font-weight: 800; white-space: nowrap; display: inline-block; }
  .b-green { background: var(--green-soft); color: var(--green); }
  .b-orange { background: var(--orange-soft); color: var(--orange); }
  .b-red { background: var(--red-soft); color: var(--red); }
  .b-purple { background: var(--purple-soft); color: var(--purple); }
  .b-accent { background: var(--accent-soft); color: var(--accent); }
  .b-muted { background: var(--hover); color: var(--muted); border: 1px solid var(--border); }
  .meter { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
  .meter-track { width: 66px; height: 6px; border-radius: 4px; background: var(--border); overflow: hidden; }
  .meter-fill { height: 6px; }
  .meter-val { font-family: var(--f-num); font-weight: 800; font-size: 13px; width: 26px; text-align: right; }
  .checks { display: inline-flex; gap: 3px; }
  .chk { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .chk-1 { background: var(--green); }
  .chk-0 { background: var(--red); }
  .chk-n { background: transparent; border: 1.5px solid var(--neutral); }

  .pager { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .pager-btns { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  .pg { min-width: 32px; height: 32px; padding: 0 8px; display: flex; align-items: center; justify-content: center; border-radius: 8px; cursor: pointer; font-size: 12.5px; font-weight: 700; background: var(--card); color: var(--text); border: 1px solid var(--border); }
  .pg[aria-current="page"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  .pg:disabled { opacity: .45; cursor: default; }

  .split { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 14px; }
  .panel { padding: 18px; }
  .panel-title { font-weight: 800; font-size: 15px; }
  .panel-sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .chart { width: 100%; height: auto; display: block; margin-top: 14px; }
  .chart text { font-family: var(--f-num); font-size: 11px; fill: var(--muted); }
  .chart .val { fill: var(--text); font-weight: 700; }
  .chart .grid { stroke: var(--border); stroke-width: 1; }
  .bars { display: flex; flex-direction: column; gap: 13px; margin-top: 14px; }
  .bar-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 5px; }
  .bar-label { font-size: 13px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-val { margin-left: auto; font-family: var(--f-num); font-size: 12.5px; font-weight: 700; white-space: nowrap; }
  .bar-track { height: 7px; border-radius: 5px; background: var(--border); overflow: hidden; }
  .bar-fill { height: 7px; }
  .table-head { display: flex; align-items: center; gap: 12px; padding: 15px 18px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .note { color: var(--muted); font-size: 12.5px; }
  .empty { padding: 48px 24px; text-align: center; color: var(--muted); }
  .dashed { border: 1px dashed var(--border); border-radius: 14px; background: var(--card); }

  .fav-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
  .fav-card { padding: 16px; }
  .trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
  .trio-label { color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; }
  .trio-val { font-family: var(--f-num); font-weight: 700; font-size: 13px; }

  /* ---------- карточка приложения ---------- */
  .overlay { position: fixed; inset: 0; background: var(--overlay); z-index: 60; display: flex; justify-content: flex-end; }
  .drawer { width: min(640px, 100%); height: 100%; background: var(--bg); overflow-y: auto; box-shadow: var(--shadow); }
  .drawer-head { position: sticky; top: 0; background: var(--card); border-bottom: 1px solid var(--border); padding: 18px 22px; display: flex; gap: 14px; align-items: center; z-index: 2; }
  .drawer-body { padding: 20px 22px 40px; display: flex; flex-direction: column; gap: 14px; }
  .check-list { display: flex; flex-direction: column; }
  .check-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--border); font-size: 13.5px; }
  .check-row:first-child { border-top: 0; }
  .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 18px; margin-top: 12px; }
  .kv dt { color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
  .kv dd { margin: 2px 0 0; font-family: var(--f-num); font-weight: 700; font-size: 13px; }

  @media (max-width: 1100px) { .split { grid-template-columns: 1fr; } }
  @media (max-width: 900px) {
    .app { flex-direction: column; }
    .side { width: 100%; flex: none; height: auto; position: static; }
    .side-nav { flex-direction: row; overflow-x: auto; padding-bottom: 10px; }
    .nav-item { width: auto; white-space: nowrap; }
    .side-label, .side-foot { display: none; }
    .topbar { position: static; padding: 12px 16px; }
    .page { padding: 18px 14px; }
    .head-side { margin-left: 0; align-items: flex-start; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="app">
  <aside class="side" aria-label="Разделы">
    <div class="brand"><div class="brand-mark">A</div><div class="brand-name">AppRadar</div></div>
    <div class="side-label">Каталог</div>
    <nav class="side-nav" id="nav-catalog"></nav>
    <div class="side-label">Отчёты</div>
    <nav class="side-nav" id="nav-reports"></nav>
    <div class="side-foot">
      <div class="side-avatar" id="foot-avatar">PR</div>
      <div style="min-width:0">
        <div class="side-foot-title">Play Radar</div>
        <div class="side-foot-sub" id="foot-sub"></div>
      </div>
    </div>
  </aside>

  <main>
    <header class="topbar">
      <label class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="color:var(--muted)"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="search" placeholder="Название приложения, package, ниша или ключ…" aria-label="Поиск">
      </label>
      <div class="top-right">
        <div class="chip-btn chip-static">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="color:var(--green)"><path d="M12 3l7.5 4.2v8.6L12 21l-7.5-5.2V7.2z"/></svg>
          Google Play
        </div>
        <div class="geo-wrap">
          <button class="chip-btn" id="geo-btn" aria-haspopup="listbox" aria-expanded="false"></button>
          <div class="geo-menu" id="geo-menu" role="listbox" hidden></div>
        </div>
        <button class="icon-btn" id="theme-btn" aria-label="Переключить тему"></button>
      </div>
    </header>
    <div id="view"></div>
  </main>
</div>
<div id="drawer-root"></div>

<script id="radar-data" type="application/json">__RADAR_DATA__</script>

  function niceMax(v) {
    if (!(v > 0)) return 1;

  }
  // Столбцы. Одна шкала ставит и столбцы, и деления, и подписи; подписи оси — только значения,
  // которых шкала достигает. log: высота по log10, деления — степени десяти.
  function columns(items, opt) {
    opt = opt || {};
    var W = 640, H = 250, L = 52, R = 10, T = 22, B = 40;
    var n = items.length || 1, cw = (W - L - R) / n, bw = Math.min(46, cw * 0.62);
    var fmt = opt.fmt || short;
    var vals = items.map(function (i) { return isNum(i.value) ? i.value : 0; });
    var ticks = [], scale;
    if (opt.log) {
      var hi = Math.max(10, Math.max.apply(null, vals));
      var top = Math.ceil(Math.log10(hi));
      for (var e = 0; e <= top; e++) ticks.push(Math.pow(10, e));
      scale = function (v) { return v > 0 ? Math.max(0, Math.log10(v)) / top : 0; };
    } else {
      var mx = niceMax(Math.max.apply(null, vals));
      for (var k = 0; k <= 4; k++) ticks.push(mx * k / 4);
      scale = function (v) { return v / mx; };

    ticks.forEach(function (t) {
      var y = T + ph - scale(t) * ph;
      s += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '"/>';
      s += '<text x="' + (L - 8) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="end">' + esc(opt.tickFmt ? opt.tickFmt(t) : fmt(t)) + '</text>';
    });
    items.forEach(function (it, i) {
      var v = vals[i], h = Math.max(v > 0 ? 2 : 0, scale(v) * ph);
      var x = L + cw * i + (cw - bw) / 2, y = T + ph - h;
      s += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) +

      if (n <= 16) s += '<text class="val" x="' + (x + bw / 2).toFixed(1) + '" y="' + (y - 6).toFixed(1) + '" text-anchor="middle">' + esc(it.valueText || fmt(v)) + '</text>';

    return {
      title: 'Воронка отсева',
      lead: 'Каждое найденное приложение проходит фильтры методики. Ничего не удаляется: отсеянное остаётся в базе с причиной и датой, и его можно вернуть, если порог пересмотрят.',
      kpis: [
        { label: 'Оценено', value: int(total), hint: 'карточек в гео' },
        { label: 'Прошло', value: int(passed), delta: pct(passed / total), deltaColor: 'var(--green)', hint: 'кандидаты на наблюдение' },
        { label: 'Отсеяно', value: int(total - passed), hint: 'с записанной причиной' },
        { label: 'Главная причина', value: rejected.length ? pct(rejected[0].count / total) : '—', hint: rejected.length ? (REASON_TEXT[rejected[0].reason] || rejected[0].reason) : '' }
      ],
      chartTitle: 'Куда уходят приложения', chartSub: 'по группам причин',
      chart: columns(order.map(function (k) { return { label: k, value: groups[k], color: GROUP_COLOR[k] }; }), { fmt: function (v) { return int(v); }, aria: 'группы причин отсева' }),
      barsTitle: 'Причины отсева', barsSub: 'от самой частой',
      bars: barsList(rejected.slice(0, 8).map(function (r) { return { label: REASON_TEXT[r.reason] || r.reason, value: int(r.count), w: r.count / maxReason, color: GROUP_COLOR[REASON_GROUP[r.reason] || 'Вне периметра'] }; })),
      tableTitle: 'Все причины', tableNote: 'снимок воронки гео',
      table: tableHtml([
        { t: 'Причина', v: function (r) { return '<div class="strong">' + esc(REASON_TEXT[r.reason] || r.reason) + '</div><div class="muted small num">' + esc(r.reason) + '</div>'; } },
        { t: 'Группа', v: function (r) { var k = REASON_GROUP[r.reason] || 'Вне периметра'; return '<span class="badge" style="background:var(--hover);color:' + GROUP_COLOR[k] + ';border:1px solid var(--border)">' + esc(k) + '</span>'; } },
        { t: 'Приложений', r: true, cls: 'num strong', v: function (r) { return int(r.count); } },
        { t: 'Доля', r: true, cls: 'num', v: function (r) { return pct(r.count / total, 1); } }
      ], g.funnel.slice().sort(function (a, b) { return b.count - a.count; }), { minWidth: 680 })
    };
  };

  BUILD.status = function () {
    var byDate = {};
    D.timeline.forEach(function (t) { byDate[t.date] = (byDate[t.date] || 0) + t.cards; });
    var dates = Object.keys(byDate).sort();
    var rows = D.geos.filter(function (x) { return matchesQ([x.geo, GEO_NAMES[x.geo]]); }).map(function (x) {
      var data = D.geoData[x.geo];
      var apps = data ? data.apps : [];
      var checked = apps.filter(function (a) { return a.ads_found && a.ads_found !== 'unchecked'; }).length;
      return Object.assign({}, x, { passed: apps.length, niches: data ? data.niches.length : 0, ads_cov: apps.length ? checked / apps.length : null });
    });
    var topGeo = rows.slice().sort(function (a, b) { return b.passed - a.passed; }).slice(0, 8);
    var maxP = topGeo.length ? topGeo[0].passed || 1 : 1;
    var lastDate = dates[dates.length - 1];
    return {
      title: 'Состояние сбора', noGeo: true,
      lead: 'Что и когда снято. Каждое гео проходит полный цикл: чарты, подсказки, выдача, карточки, граф похожих, отзывы, скоринг, проверка рекламы. Метрики роста включаются по мере накопления снимков.',
      kpis: [
        { label: 'Гео с данными', value: int(Object.keys(D.geoData).length), hint: 'из ' + D.geos.length + ' в каталоге' },
        { label: 'Дней со снимками', value: int(dates.length), hint: dates.length ? 'с ' + dates[0] + ' по ' + lastDate : '' },
        { label: 'Карточек в последний день', value: int(byDate[lastDate]), hint: lastDate || '' },
        { label: 'Рост 7 дней', value: dates.length >= 7 ? 'доступен' : 'нет', deltaColor: 'var(--orange)', hint: dates.length >= 7 ? 'история достаточна' : 'нужно 7 дней истории, есть ' + dates.length }
      ],
      chartTitle: 'Снято карточек по дням', chartSub: 'сумма по всем гео — единственный временной ряд, который уже есть',
      chart: columns(dates.map(function (dt) { return { label: dt.slice(8, 10) + '.' + dt.slice(5, 7), value: byDate[dt] }; }), { aria: 'карточек по дням' }),
      barsTitle: 'Прошли воронку по гео', barsSub: 'восемь гео с наибольшим числом',
      bars: barsList(topGeo.map(function (x) { return { label: x.geo + ' · ' + (GEO_NAMES[x.geo] || ''), value: int(x.passed), w: x.passed / maxP, color: x.is_reference ? 'var(--accent)' : 'var(--green)' }; })),
      tableTitle: 'Гео', tableNote: 'референс — ' + REF,
      table: tableHtml([
        { t: 'Гео', v: function (x) { return '<span class="geo-code">' + x.geo + '</span> <span class="strong">' + esc(GEO_NAMES[x.geo] || x.geo) + '</span>' + (x.is_reference ? ' <span class="badge b-accent">референс</span>' : ''); } },
        { t: 'Тир', r: true, cls: 'num', v: function (x) { return x.tier; } },
        { t: 'Последний день', cls: 'num', v: function (x) { return esc(x.date || '—'); } },
        { t: 'Снимков', r: true, cls: 'num', v: function (x) { return x.snapshots; } },
        { t: 'Найдено', r: true, cls: 'num', v: function (x) { return int(x.discovered); } },
        { t: 'Ключей', r: true, cls: 'num', v: function (x) { return int(x.keywords_total); } },
        { t: 'Ниш', r: true, cls: 'num', v: function (x) { return int(x.niches); } },
        { t: 'Прошли воронку', r: true, cls: 'num strong', v: function (x) { return int(x.passed); } },
        { t: 'Реклама проверена', r: true, v: function (x) { return isNum(x.ads_cov) ? '<span class="badge num ' + (x.ads_cov >= 0.8 ? 'b-green' : x.ads_cov >= 0.4 ? 'b-orange' : 'b-red') + '">' + pct(x.ads_cov) + '</span>' : '<span class="muted">—</span>'; } }
      ], rows, { minWidth: 980 })
    };
  };

  function emptyReport(title, text) {
    return { title: title, lead: text, kpis: [], chartTitle: '', chart: '', barsTitle: '', bars: '', tableTitle: '', table: '<div class="empty">' + esc(text) + '</div>' };
  }

  // ---------------- карточка приложения ----------------
  function findApp(id, geo) {
    var g = D.geoData[geo];
    var row = g ? g.apps.filter(function (a) { return a.app_id === id; })[0] : null;
    if (!row && finalistsById[id]) {
      var f = finalistsById[id];
      var bg = D.geoData[f.best_geo];
      row = bg ? bg.apps.filter(function (a) { return a.app_id === id; })[0] : null;
      geo = f.best_geo;
      if (!row) row = f;
    }
    if (!row && g) {
      var c = g.competitors.filter(function (x) { return x.app_id === id; })[0];
      if (c) row = c;
    }
    return row ? { row: row, geo: geo } : null;
  }
  function openDrawer(id, geo) {
    var found = findApp(id, geo || state.geo);
    if (!found) return;
    var a = found.row, f = finalistsById[id];
    var copyColor = copyColorFor(D.globalFinalists);
    var ch = a.checks || null;
    var iap = isNum(a.iap_min_usd) || isNum(a.iap_max_usd) ? '$' + fix(a.iap_min_usd, 2) + ' – $' + fix(a.iap_max_usd, 2) : '—';
    var html = '<div class="overlay" data-act="close"><div class="drawer" role="dialog" aria-modal="true" aria-label="' + esc(a.title || id) + '" data-stop="1">' +
      '<div class="drawer-head">' + icon(a) + '<div style="min-width:0;flex:1"><div class="app-name" style="font-size:16px">' + esc(a.title || id) + '</div>' +
        '<div class="app-pkg" style="max-width:none">' + esc(id) + ' · ' + esc(a.developer || '') + '</div></div>' +
        '<button class="icon-btn" data-act="close" aria-label="Закрыть"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>' +
      '<div class="drawer-body">' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span class="geo-code">' + esc(found.geo) + '</span>' +
          (a.genre_id ? '<span class="tag">' + esc(genre(a.genre_id)) + '</span>' : '') + adsBadge(a.ads_found) +
          (a.verification_level ? '<span class="badge b-muted">проверка: ' + esc(a.verification_level) + '</span>' : '') +
          '<a style="margin-left:auto;font-weight:700;font-size:13px" href="https://play.google.com/store/apps/details?id=' + encodeURIComponent(id) + '&gl=' + encodeURIComponent(found.geo) + '" target="_blank" rel="noopener">Открыть в Google Play ↗</a></div>' +
        kpiCards([
          { label: 'Копируемость', value: fix(a.prescore, 0), deltaColor: copyColor(a.prescore), hint: 'prescore' },
          { label: 'Установки', value: short(a.installs), hint: 'рейтинг ' + fix(a.score, 1) + ' · ' + short(a.ratings_count) + ' оценок' },
          { label: 'Door ниши', value: short(a.niche_door), hint: a.niche_head || 'ниша не определена' },
          { label: 'Гео', value: f ? String(f.geos_count) : '1', hint: f ? f.geos_list : found.geo }
        ]) +
        (ch ? '<div class="card panel"><div class="panel-title">Шесть проверок методики</div><div class="panel-sub">образец годится, только если проходит все шесть</div><div class="check-list" style="margin-top:10px">' +
          ch.map(function (c, i) {
            var label = c === 1 ? ['пройдена', 'b-green'] : c === 0 ? ['провалена', 'b-red'] : ['не проверена', 'b-muted'];
            return '<div class="check-row"><i class="chk ' + (c === 1 ? 'chk-1' : c === 0 ? 'chk-0' : 'chk-n') + '"></i><span>' + esc(CHECKS[i]) + '</span><span class="badge ' + label[1] + '" style="margin-left:auto">' + label[0] + '</span></div>';
          }).join('') + '</div></div>' : '') +
        '<div class="card panel"><div class="panel-title">Реклама и монетизация</div><dl class="kv">' +
          '<div><dt>Реклама в библиотеках</dt><dd>' + esc((ADS[a.ads_found] || ADS.unchecked)[0]) + '</dd></div>' +
          '<div><dt>Трекер в описании или политике</dt><dd>' + esc(a.tracking_matched || (a.attribution_sdk === 0 ? 'не найден' : '—')) + '</dd></div>' +
          '<div><dt>Модель</dt><dd>' + esc(a.monetization_type || '—') + '</dd></div>' +
          '<div><dt>Встроенные покупки</dt><dd>' + esc(iap) + '</dd></div>' +
          '<div><dt>Возраст</dt><dd>' + (isNum(a.age_months) ? fix(a.age_months / 12, 1) + ' лет' : '—') + '</dd></div>' +
          '<div><dt>Без обновлений</dt><dd>' + (isNum(a.days_since_update) ? int(a.days_since_update) + ' дн.' : '—') + '</dd></div>' +
        '</dl></div>' +
        (isNum(a.pain_fit) ? '<div class="card panel"><div class="panel-title">Жалобы в отзывах</div><div class="panel-sub">главная — ' + esc(PAIN[a.pain_dominant] || 'не выделяется') + ', painFit ' + fix(a.pain_fit, 2) + '</div>' +
          barsList([['Деньги', a.pain_money, 'var(--orange)'], ['Реклама', a.pain_ads, 'var(--purple)'], ['Не работает', a.pain_broken, 'var(--red)']].map(function (b) {
            return { label: b[0], value: pct(b[1], 1), w: isNum(b[1]) ? b[1] : 0, color: b[2] };
          })) + '</div>' : '') +
      '</div></div></div>';
    $('drawer-root').innerHTML = html;
    var closeBtn = $('drawer-root').querySelector('.drawer [data-act="close"]');
    if (closeBtn) closeBtn.focus();
  }
  function closeDrawer() { $('drawer-root').innerHTML = ''; }

  // ---------------- отрисовка ----------------
  function render() {
    renderNav();
    renderHeader();
    if (state.view === 'top') renderTop();
    else if (state.view === 'fav') renderFav();
    else if (BUILD[state.view]) $('view').innerHTML = reportPage(BUILD[state.view]());
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]');
    var menu = $('geo-menu');
    if (!e.target.closest('.geo-wrap')) { menu.hidden = true; $('geo-btn').setAttribute('aria-expanded', 'false'); }
    if (e.target.closest('#geo-btn')) {
      menu.hidden = !menu.hidden;
      $('geo-btn').setAttribute('aria-expanded', String(!menu.hidden));
      return;
    }
    if (e.target.closest('#theme-btn')) {
      var next = isDark() ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      save('appradar-theme', next);
      renderHeader();
      return;
    }
    if (!t) return;
    var act = t.getAttribute('data-act');
    if (act === 'close') {
      if (t.classList.contains('overlay') && e.target.closest('[data-stop]')) return;
      closeDrawer(); return;
    }
    if (act === 'view') { state.view = t.getAttribute('data-view'); state.page = 1; state.reportPage = 1; closeDrawer(); render(); window.scrollTo(0, 0); return; }
    if (act === 'geo') {
      var code = t.getAttribute('data-geo');
      if (code === 'ALL') state.allGeos = true; else { state.allGeos = false; state.geo = code; }
      state.page = 1; state.reportPage = 1; state.cat = 'all';
      menu.hidden = true; render(); return;
    }
    if (act === 'cat') { state.cat = t.getAttribute('data-cat'); state.page = 1; render(); return; }
    if (act === 'page') {
      var p = Number(t.getAttribute('data-page'));
      if (t.getAttribute('data-key') === 'top') state.page = p; else state.reportPage = p;
      render();
      var head = document.querySelector('.card .toolbar, .card .table-head');
      if (head) head.scrollIntoView({ block: 'start' });
      return;
    }
    if (act === 'fav') {
      var id = t.getAttribute('data-app'), i = state.favs.indexOf(id);
      if (i >= 0) state.favs.splice(i, 1); else state.favs.push(id);
      save('appradar-favs', state.favs);
      render(); return;
    }
    if (act === 'open') { openDrawer(t.getAttribute('data-app'), t.getAttribute('data-geo')); return; }
  });
  document.addEventListener('change', function (e) {
    var act = e.target.getAttribute('data-act');
    if (act === 'sort') { state.sort = e.target.value; state.page = 1; render(); }
    if (act === 'ads') { state.ads = e.target.value; state.page = 1; render(); }
    if (act === 'niche') { state.niche = e.target.value; render(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeDrawer(); $('geo-menu').hidden = true; }
  });
  var qTimer = null;
  $('q').addEventListener('input', function (e) {
    clearTimeout(qTimer);
    qTimer = setTimeout(function () { state.q = e.target.value.trim(); state.page = 1; state.reportPage = 1; render(); }, 160);
  });
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', renderHeader);
  }

  render();
})();
</script>
