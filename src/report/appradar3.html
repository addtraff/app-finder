<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AppRadar 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root {
    --bg: #f3f4f8; --card: #ffffff; --text: #23262f; --muted: #6f768a;
    --border: #e7e9f1; --hover: #f7f8fc; --head: #fafbfe; --input: #ffffff;

    --orange: #b86a06; --orange-soft: #fdf1e0; --red: #d23a3e; --red-soft: #fdeaea;
    --purple: #6a4be8; --purple-soft: #efeafe; --neutral: #9aa1b3;

    --f-ui: Manrope, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --f-num: "JetBrains Mono", ui-monospace, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101220; --card: #191c2b; --text: #e8eaf2; --muted: #969db2;
      --border: #262a3b; --hover: #1f2334; --head: #1c2030; --input: #14172a;
      --accent: #6d84ff; --accent-soft: #1e2547; --green: #2ecc8f; --green-soft: #14322a;
      --orange: #f0a13a; --orange-soft: #33270f; --red: #f0666a; --red-soft: #351a1c;
      --purple: #a58fff; --purple-soft: #2a2350; --neutral: #5c6378;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.28);
      --overlay: rgba(0,0,0,.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101220; --card: #191c2b; --text: #e8eaf2; --muted: #969db2;
    --border: #262a3b; --hover: #1f2334; --head: #1c2030; --input: #14172a;
    --accent: #6d84ff; --accent-soft: #1e2547; --green: #2ecc8f; --green-soft: #14322a;
    --orange: #f0a13a; --orange-soft: #33270f; --red: #f0666a; --red-soft: #351a1c;
    --purple: #a58fff; --purple-soft: #2a2350; --neutral: #5c6378;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.28);
    --overlay: rgba(0,0,0,.6);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--f-ui); font-size: 14px; line-height: 1.45; }
  button { font: inherit; color: inherit; }
  .num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); } .small { font-size: 11.5px; } .strong { font-weight: 700; }
  .app { display: flex; min-height: 100vh; }
  .side { width: 236px; flex: 0 0 236px; background: var(--side); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 20px 20px 18px; }
  .brand-mark { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg,#3d5afe,#7a5cf0); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 12px; }
  .brand-name { color: #fff; font-weight: 800; font-size: 17px; letter-spacing: -.3px; }
  .side-label { padding: 0 20px 6px; color: var(--side-muted); font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }
  .side-nav { display: flex; flex-direction: column; gap: 2px; padding: 4px 10px 16px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 9px; cursor: pointer; color: var(--side-text); background: transparent; border: 0; text-align: left; font-weight: 600; font-size: 14px; width: 100%; }
  .nav-item:hover { background: var(--side-2); }
  .nav-item[aria-current="page"] { background: var(--accent); color: #fff; }
  .nav-count { margin-left: auto; background: var(--side-2); border-radius: 20px; padding: 2px 8px; font-size: 11px; font-weight: 700; }
  .nav-item[aria-current="page"] .nav-count { background: rgba(255,255,255,.2); }
  .side-note { margin: auto 20px 18px; color: var(--side-muted); font-size: 11.5px; line-height: 1.5; }
  .side-note b { color: var(--side-text); }
  main { flex: 1; min-width: 0; }
  .topbar { position: sticky; top: 0; z-index: 20; background: var(--card); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .search { display: flex; align-items: center; gap: 8px; background: var(--hover); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; flex: 1 1 280px; max-width: 440px; }
  .search input { border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; width: 100%; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); font-weight: 700; font-size: 13px; }
  select { padding: 7px 10px; border: 1px solid var(--border); border-radius: 9px; background: var(--input); color: var(--text); font: inherit; font-size: 13px; font-weight: 600; }
  .page { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .eyebrow { color: var(--accent); font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; }
  h1 { margin: 4px 0 6px; font-size: 24px; font-weight: 800; letter-spacing: -.5px; text-wrap: balance; }
  .lead { margin: 0; color: var(--muted); font-size: 13.5px; max-width: 80ch; text-wrap: pretty; }
  .warn { border: 1px solid var(--orange); background: var(--orange-soft); color: var(--orange); border-radius: 12px; padding: 14px 16px; font-size: 13px; }
  .warn b { display: block; margin-bottom: 4px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); }
  .kpi { padding: 14px 16px; }

  .tbl { overflow-x: auto; }

  td { padding: 10px; font-size: 13px; vertical-align: top; border-top: 1px solid var(--border); }
  th:first-child, td:first-child { padding-left: 16px; } th:last-child, td:last-child { padding-right: 16px; }
  tbody tr:hover { background: var(--hover); }
  .r { text-align: right; }
  .badge { padding: 3px 8px; border-radius: 6px; font-size: 11.5px; font-weight: 800; white-space: nowrap; display: inline-block; }
  .b-green { background: var(--green-soft); color: var(--green); }
  .b-orange { background: var(--orange-soft); color: var(--orange); }
  .b-red { background: var(--red-soft); color: var(--red); }
  .b-accent { background: var(--accent-soft); color: var(--accent); }
  .b-muted { background: var(--hover); color: var(--muted); border: 1px solid var(--border); }
  .b-purple { background: var(--purple-soft); color: var(--purple); }
  .name { font-weight: 700; font-size: 13.5px; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; color: inherit; }
  .name:hover { color: var(--accent); }
  .pkg { color: var(--muted); font-size: 11px; font-family: var(--f-num); max-width: 230px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pager { display: flex; gap: 8px; padding: 13px 16px; border-top: 1px solid var(--border); align-items: center; flex-wrap: wrap; }
  .pg { min-width: 32px; height: 30px; padding: 0 9px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); cursor: pointer; font-size: 12.5px; font-weight: 700; }
  .pg[aria-current="page"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  .overlay { position: fixed; inset: 0; background: var(--overlay); z-index: 60; display: flex; justify-content: flex-end; }
  .drawer { width: min(720px,100%); height: 100%; background: var(--bg); overflow-y: auto; }
  .drawer-head { position: sticky; top: 0; background: var(--card); border-bottom: 1px solid var(--border); padding: 16px 20px; display: flex; gap: 12px; align-items: center; z-index: 2; }
  .drawer-body { padding: 18px 20px 40px; display: flex; flex-direction: column; gap: 12px; }
  .block { padding: 16px 18px; }
  .block h3 { margin: 0 0 2px; font-size: 14px; font-weight: 800; }
  .block .sub { color: var(--muted); font-size: 12px; margin-bottom: 10px; text-wrap: pretty; }
  .pairs { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 10px 16px; }
  .pair dt { color: var(--muted); font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
  .pair dd { margin: 3px 0 0; font-family: var(--f-num); font-weight: 700; font-size: 14px; }
  .pair .note { font-family: var(--f-ui); font-weight: 500; font-size: 11.5px; color: var(--muted); }
  .risk-list { margin: 8px 0 0; padding-left: 18px; font-size: 12.5px; color: var(--text); }
  .risk-list li { margin: 3px 0; }
  .btn { padding: 7px 12px; border-radius: 9px; border: 1px solid var(--border); background: var(--card); font-weight: 700; font-size: 13px; cursor: pointer; }
  .empty { padding: 40px 24px; text-align: center; color: var(--muted); }
  .manual li { margin: 7px 0; }
  .manual h3 { margin: 18px 0 6px; font-size: 15px; }
  @media (max-width: 900px) {
    .app { flex-direction: column; }
    .side { width: 100%; flex: none; height: auto; position: static; }
    .side-nav { flex-direction: row; overflow-x: auto; } .nav-item { width: auto; white-space: nowrap; }
    .side-label, .side-note { display: none; }
    .page { padding: 16px; } .topbar { position: static; padding: 12px 16px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head><body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="brand-mark">A3</div><div class="brand-name">AppRadar 3</div></div>
    <div class="side-label">Разделы</div>
    <nav class="side-nav" id="nav"></nav>
    <p class="side-note">Отчёт отвечает на вопрос <b>«стоит ли это повторять»</b> и намеренно не сводит всё в один индекс: рынок, органика, импульс и риск показываются рядом, каждый со своим основанием.</p>
  </aside>
  <main>
    <header class="topbar">
      <label class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="color:var(--muted)"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="search" placeholder="Приложение, разработчик или тема…" aria-label="Поиск">
      </label>
      <div class="chip" id="date-chip"></div>
      <div class="field"><label for="geo">Гео</label><select id="geo"></select></div>
      <button class="btn" id="theme">Тема</button>
    </header>
    <div id="view"></div>
  </main>
</div>
<div id="drawer-root"></div>
<script id="radar-data" type="application/json">__RADAR_DATA__</script>
<script>
__UNPACK_JS__
(function () {
  'use strict';
  var D = unpackRows(JSON.parse(document.getElementById('radar-data').textContent));
  var M = D.meta, WW = 'WW';
  var PAGE = 50;
  var state = { view: 'cand', geo: WW, page: 1, q: '', risk: 'all', paid: 'all', mom: 'all', sort: 'risk',
    inst: 0, instMax: 0, age: 'all', flow: 0, freedom: 0, quad: 'all', concept: 'all', meas: 'all', ubt: 'all',
    spread: 'all', cpy: 'all', dem: 0, door5: 0, nDem: 0, nDoor5: 0, nDoor: 0, nFlow: 0, nFreedom: 0, nPurity: 0, nKeys: 0, nQuad: 'all', nStab: 0, nDevs: 0, nYoung: 0, nRating: 0, nSort: 'freedom' };

  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); };
  var isNum = function (v) { return typeof v === 'number' && isFinite(v); };
  var fix = function (v, n) { return isNum(v) ? v.toFixed(n == null ? 1 : n) : '—'; };
  var int = function (v) { return isNum(v) ? Math.round(v).toLocaleString('ru-RU') : '—'; };
  var pct = function (v, n) { return isNum(v) ? (v * 100).toFixed(n == null ? 0 : n) + ' %' : '—'; };
  var short = function (v) {
    if (!isNum(v)) return '—';
    var a = Math.abs(v);
    if (a >= 1e9) return (v / 1e9).toFixed(1) + ' млрд';
    if (a >= 1e6) return (v / 1e6).toFixed(a >= 1e7 ? 0 : 1) + ' млн';
    if (a >= 1e3) return (v / 1e3).toFixed(a >= 1e4 ? 0 : 1) + ' тыс.';
    return String(Math.round(v));
  };
  var dash = function (why) { return '<span class="muted" title="' + esc(why || 'нет данных') + '">—</span>'; };

  var QUAD = { target: ['Цель', 'b-green'], bought: ['Трафик выкуплен', 'b-orange'], mature: ['Зрелая ниша', 'b-accent'], pass: ['Мимо', 'b-muted'], undetermined: ['Не определено', 'b-muted'] };
  function quadBadge(q) { var x = QUAD[q] || QUAD.undetermined; return '<span class="badge ' + x[1] + '">' + x[0] + '</span>'; }
  // Стоимость повторения: три оси ТЗ и три градации. Балла нет намеренно — балл потребовал
  // бы весов, которых взять неоткуда; перечисление осей проверяемо, балл нет.
  var CPY = {
    easy: ['Дёшево повторить', 'b-green', 'Опасных разрешений нет, категория обычная, внешний поток данных не нужен.'],
    medium: ['Средняя цена', 'b-orange', 'Сработала одна ось из трёх: разрешения, модерация категории или покупной поток данных.'],
    hard: ['Дорого повторить', 'b-red', 'Сработали минимум две оси из трёх.']
  };
  function cpyBadge(r) {
    var c = CPY[r.cpy] || CPY.easy;
    return '<div style="margin-top:8px"><span class="badge ' + c[1] + '" title="' + esc(c[2]) + '">' + esc(c[0]) + ((r.cpy_unknown || []).length ? ' · не ниже' : '') + '</span></div>';
  }
  // Спрос — показов в день по ядровым ключам ниши, навигационные исключены. Источник —
  // ASO-сервис, то есть их модель, а не выгрузка Google: для решения годится, за факт
  // выдавать нельзя. Оценка по США помечена «~» и подписью.
  // Дверь в топ-5: та же величина, но по местам 1–5. По США вход в пятёрку дороже входа в
  // десятку в среднем в двенадцать раз, а у каждой восьмой ниши разницы почти нет — именно
  // такие и интересны: попасть внутрь и сразу оказаться высоко.
  function door5Line(n) {
    if (!isNum(n.door5)) return '<div class="muted small">топ-5 не посчитан</div>';
    var mult = isNum(n.door) && n.door > 0 ? n.door5 / n.door : null;
    return '<div class="muted small">топ-5: ' + short(n.door5) + (mult ? ' (×' + fix(mult, 1) + ')' : '') + '</div>';
  }
  function demandHtml(n) {
    if (!isNum(n.dem)) return dash('внешних объёмов по этой нише нет');
    if (n.dem === 0) return '<div class="num muted">ниже порога</div><div class="muted small">измерено ' + (isNum(n.dem_cov) ? pct(n.dem_cov) : '—') + '</div>';
    if (n.dem_est) return '<div class="num muted">~' + short(n.dem) + '</div><div class="small" style="color:var(--orange)">оценка по US</div>';
    var tr = '';
    if (isNum(n.dem_tr)) {
      var flat = Math.abs(n.dem_tr) < 0.05, up = n.dem_tr > 0;
      tr = '<div class="small" style="color:' + (flat ? 'var(--muted)' : (up ? 'var(--green)' : 'var(--orange)')) + '">'
        + (flat ? '= без изменений' : (up ? '↑ +' : '↓ ') + Math.round(n.dem_tr * 100) + ' %') + '</div>';
    } else tr = '<div class="muted small">направление неизвестно</div>';
    return '<div class="num strong">' + short(n.dem) + '</div>' + tr
      + '<div class="muted small">' + (isNum(n.dem_cov) ? 'покрытие ' + pct(n.dem_cov) : 'в день') + '</div>';
  }
  function riskBadge(n) {
    var cls = n <= 1 ? 'b-green' : n <= 3 ? 'b-orange' : 'b-red';
    var txt = n <= 1 ? 'низкий' : n <= 3 ? 'средний' : 'высокий';
    return '<span class="badge ' + cls + '">' + txt + ' · ' + n + '</span>';
  }
  // Импульс: прирост охвата по ключам, посчитанный на общей базе ключей обеих дат.
  function momentum(r) { return (r.k50 == null || r.k50p == null) ? null : r.k50 - r.k50p; }
  function growth(r) { return r.interp != null ? r.interp : (r.est || null); }

  var SECTIONS = [
    { id: 'cand', title: 'Кандидаты', count: function () { return D.rows.length; } },
    { id: 'niches', title: 'Ниши', count: function () { return D.niches.length; } },
    { id: 'rejected', title: 'Отсеянные', count: function () { return (D.rejected || []).length; } },
    { id: 'how', title: 'Как читать', count: function () { return null; } }
  ];
  function renderNav() {
    $('nav').innerHTML = SECTIONS.map(function (s) {
      var c = s.count();
      return '<button class="nav-item" data-view="' + s.id + '"' + (state.view === s.id ? ' aria-current="page"' : '') + '>' +
        esc(s.title) + (c == null ? '' : '<span class="nav-count">' + int(c) + '</span>') + '</button>';
    }).join('');
  }
  function renderHead() {
    $('date-chip').textContent = 'срез ' + M.date + ' · история ' + M.history.days + ' дн.';
    var geos = [WW].concat(D.geos.filter(function (g) { return g.date; }).map(function (g) { return g.geo; }));
    $('geo').innerHTML = geos.map(function (g) { return '<option value="' + g + '"' + (state.geo === g ? ' selected' : '') + '>' + (g === WW ? 'все страны' : g) + '</option>'; }).join('');
  }
  function matches(r) {
    if (!state.q) return true;
    var s = state.q.toLowerCase();
    return [r.title, r.app_id, r.dev, r.concept, r.head].some(function (v) { return v && String(v).toLowerCase().indexOf(s) >= 0; });
  }

  // ---------------- кандидаты ----------------
  function candRows() {
    var rows = D.rows.filter(function (r) {
      if (state.geo !== WW && r.geo !== state.geo) return false;
      if (state.risk !== 'all' && !(r.risk_n <= Number(state.risk))) return false;
      if (state.paid !== 'all' && !(isNum(r.pscore) && r.pscore <= Number(state.paid))) return false;
      if (state.mom === '1' && !(momentum(r) > 0)) return false;
      if (state.inst && !(r.installs >= state.inst)) return false;
      if (state.instMax && !(r.installs <= state.instMax)) return false;
      if (state.age !== 'all' && !(isNum(r.age) && r.age < Number(state.age))) return false;
      if (state.flow && !(isNum(r.door_flow) && r.door_flow <= state.flow)) return false;
      if (state.freedom && !(isNum(r.freedom) && r.freedom >= state.freedom)) return false;
      if (state.quad !== 'all' && (r.quad || 'undetermined') !== state.quad) return false;
      if (state.concept !== 'all' && (r.concept || '') !== state.concept) return false;
      if (state.meas === '1' && r.interp == null) return false;
      if (state.ubt === '1' && !r.ubt) return false;
      if (state.spread === 'grow' && !((r.geos_n || 0) > (r.geos_prev || 0))) return false;
      if (state.dem && !(isNum(r.dem) && r.dem >= state.dem)) return false;
      if (state.door5 && !(isNum(r.door5) && r.door5 <= state.door5)) return false;
      if (state.cpy === 'checked' && (r.cpy_unknown || []).length) return false;
      if (state.cpy !== 'all' && state.cpy !== 'checked' && r.cpy !== state.cpy) return false;
      if (state.spread !== 'all' && state.spread !== 'grow' && !((r.geos_n || 0) >= Number(state.spread))) return false;
      return matches(r);
    });

          pair('Охват топ-50', m == null ? '—' : r.k50p + ' → ' + r.k50, m == null ? 'нет сравнения' : (m > 0 ? '+' : '') + m + ' за ' + r.kwd + ' дн.') +
          pair('Охват топ-10', r.k10 == null ? '—' : r.k10p + ' → ' + r.k10, '') +
          pair('Рост в месяц', g == null ? '—' : (r.interp == null ? '~' : '+') + short(g), r.interp == null ? 'оценка по отзывам' : 'измерено за ' + r.w + ' дн.') +
          pair('Возраст числа', isNum(r.stale) ? r.stale + ' дн.' : '—', 'с последнего обновления счётчика') +
          pair('Установок', short(r.installs), '') +
          pair('Возраст', isNum(r.age) ? fix(r.age, 0) + ' мес' : '—', r.young ? 'молодое' : '') +
          pair('Стран в выдаче', int(r.geos_n), (function () {
            var dn = (r.geos_n || 0) - (r.geos_prev || 0);
            return dn > 0 ? 'неделю назад ' + r.geos_prev + ', +' + dn : dn < 0 ? 'неделю назад ' + r.geos_prev : 'не менялось за неделю';
          })()) +
          pair('Где именно', r.geos_list ? esc(r.geos_list.split(',').slice(0, 8).join(' ')) : '—', r.geos_list && r.geos_list.split(',').length > 8 ? 'и другие' : '') +
        '</div></div>' +
        '<div class="card block"><h3>Риск самообмана</h3><div class="sub">Чего не хватает, чтобы верить этой строке</div>' +
          riskBadge(r.risk_n) +
          (r.risk.length ? '<ul class="risk-list">' + r.risk.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>'
            : '<p class="sub" style="margin-top:8px">Ни один фактор не сработал — редкий случай.</p>') +
        '</div>' +
        '<div class="card block"><h3>Повторяемость и соперник</h3><div class="sub">Делал ли это кто-то ещё и насколько он силён</div><div class="pairs">' +
          pair('Независимых разработчиков', int(r.devs), 'в этой теме') +
          pair('Из них молодых', int(r.devs_young), 'моложе года') +
          pair('С 100 тыс.+', int(r.devs_big), 'дошли до заметного размера') +
          pair('Рейтинг крупных', isNum(r.inc_rating) ? fix(r.inc_rating, 2) : '—', 'у приложений от 100 тыс. установок') +
          pair('Жалобы на поломки', pct(r.inc_pain_broken), 'у них же') +
          pair('Просят функции', pct(r.inc_pain_missing), 'у них же') +
        '</div></div>' +
        '<div class="card block"><h3>Чем недовольны пользователи</h3><div class="sub">Жалоба — это описание незакрытого спроса, а не оценка приложения</div>' +
          (r.labeled ? '<div class="pairs">' +
            pair('Просят функции', pct(r.p_missing), 'чего не хватает') +
            pair('Поломки', pct(r.p_broken), 'не работает то, что обещано') +
            pair('Реклама', pct(r.p_ads), 'слишком много или мешает') +
            pair('Деньги', pct(r.p_money), 'цена, подписка, возвраты') +
            pair('Недоверие', pct(r.p_trust), 'обман, списания, подозрения') +
            pair('Размечено отзывов', int(r.labeled), 'доли считаются от них') +
          '</div>' : '<p class="sub" style="margin-top:8px">Отзывов размечено слишком мало — доли не считаются. Это «неизвестно», а не «жалоб нет».</p>') +
        '</div>' +
        '<div class="card block"><h3>Монетизация</h3><div class="sub">Чем зарабатывает тот, кого предлагается повторить</div><div class="pairs">' +
          pair('Способ', esc(r.mtype || '—'), r.has_ads ? 'реклама в карточке заявлена' : '') +
          pair('Цены в приложении', isNum(r.iap_lo) && isNum(r.iap_hi) ? '$' + fix(r.iap_lo, 2) + ' – $' + fix(r.iap_hi, 2) : (isNum(r.iap_hi) ? 'до $' + fix(r.iap_hi, 2) : '—'), 'из карточки Play') +
          pair('Жалобы на деньги', pct(r.p_money), 'чем выше, тем хуже принимают цену') +
        '</div>' +
          '<p class="sub" style="margin-top:8px">Это способ заработка из карточки, а не выручка: сколько приложение получает на самом деле, из витрины не видно.</p>' +
        '</div>' +
        '<div class="card block"><h3>Стоимость повторения</h3><div class="sub">Три оси: разрешения, модерация категории, внешний поток данных</div>' +
          cpyBadge(r) +
          ((r.cpy_why || []).length ? '<ul class="risk-list">' + r.cpy_why.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '') +
          ((r.cpy_perm || []).length ? '<div class="sub" style="margin-top:6px">Просит: ' + esc(r.cpy_perm.slice(0, 5).join('; ')) + '</div>' : '') +
          ((r.cpy_unknown || []).length ? '<div class="sub" style="margin-top:6px;color:var(--orange)">Не проверено: ' + esc(r.cpy_unknown.join(', ')) + ' — уровень может быть только хуже.</div>' : '') +
          '<div class="pairs" style="margin-top:10px">' +
          pair('Категория', esc(r.genre || '—'), '') +
          pair('Риск категории', r.polrisk ? 'повышенный' : 'обычный', '') +
          pair('Проверок пройдено', int(r.checks_ok), 'из семи') +
          pair('Провалено', int(r.checks_bad), '') +
        '</div></div>' +
      '</div></div></div>';
  }

  // ---------------- события ----------------
  function render() {
    renderNav(); renderHead();
    if (state.view === 'niches') renderNiches();
    else if (state.view === 'rejected') renderRejected();
    else if (state.view === 'how') renderHow();
    else renderCand();
  }
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-view]');
    if (t) { state.view = t.getAttribute('data-view'); state.page = 1; render(); window.scrollTo(0, 0); return; }
    if (e.target.closest('[data-close]')) { $('drawer-root').innerHTML = ''; return; }
    var a = e.target.closest('[data-app]');
    if (a) { openCard(a.getAttribute('data-app'), a.getAttribute('data-geo')); return; }
    var p = e.target.closest('[data-page]');
    if (p) { state.page = Number(p.getAttribute('data-page')); render(); window.scrollTo(0, 0); return; }
    if (e.target.id === 'theme') {
      var dark = document.documentElement.getAttribute('data-theme') === 'dark'
        || (!document.documentElement.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
      try { localStorage.setItem('appradar3-theme', dark ? 'light' : 'dark'); } catch (err) { /* приватное окно */ }
    }
  });
  document.addEventListener('change', function (e) {
    if (e.target.id === 'geo') { state.geo = e.target.value; state.page = 1; render(); return; }
    var k = e.target.getAttribute('data-key');
    if (k) {
      var numeric = ['inst', 'instMax', 'flow', 'freedom', 'nDoor', 'nFlow', 'nFreedom', 'nPurity', 'nKeys', 'nStab', 'nDevs', 'nYoung', 'nRating',
        'dem', 'nDem', 'door5', 'nDoor5'];
      state[k] = numeric.indexOf(k) >= 0 ? Number(e.target.value) : e.target.value;
      state.page = 1; render();
    }
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'q') { state.q = e.target.value.trim(); state.page = 1; render(); $('q').focus(); }
  });
  try { var th = localStorage.getItem('appradar3-theme'); if (th) document.documentElement.setAttribute('data-theme', th); } catch (err) { /* приватное окно */ }
  render();
})();
</script>
</body></html>
